<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ไต้ก๋ง ซีฟู้ด · เมนูของทะเล</title>
<meta name="description" content="ของทะเลสด คัดเกรด แช่แข็งพร้อมส่ง · ดูสินค้าและราคา แล้วสั่งซื้อผ่าน LINE">
<meta property="og:title" content="ไต้ก๋ง ซีฟู้ด · เมนูของทะเล">
<meta property="og:description" content="ดูสินค้า ราคา และสถานะสินค้า แล้วสั่งซื้อผ่าน LINE">
<meta name="theme-color" content="#0B2545">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://taikong-seafood-back-office-default-rtdb.asia-southeast1.firebasedatabase.app">
<style>
:root{--bg:#EEF5FC;--surface:#fff;--surface-2:#F6FAFE;--line:#D9E6F3;--ink:#0B2545;--ink-2:#3C5573;--ink-3:#7489A3;--blue:#1668E3;--blue-soft:#E3EEFD;--navy:#0B2545;
  --green:#12925B;--green-soft:#E3F5EC;--amber:#B26A00;--amber-soft:#FFF3D6;--red:#D83A3A;--red-soft:#FDECEC;--line-green:#06C755;
  --font:'IBM Plex Sans','IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07172B;--surface:#0E2340;--surface-2:#112A4B;--line:#1E3A60;--ink:#EAF2FC;--ink-2:#B3C6DD;--ink-3:#7F97B4;--blue:#4C8FF5;--blue-soft:#15335E;--green-soft:#0F3326;--amber-soft:#3A2C10;--amber:#F2B544;--red-soft:#3A1A1F}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1280px;flex-wrap:wrap;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-size:19px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:14.5px;letter-spacing:.04em;line-height:1.2}
.brand small{color:var(--ink-3);font-size:12px}
.grow{flex:1}
.back{border:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:38px;padding:0 12px;cursor:pointer;font-weight:500}
.linebtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--line-green);color:#fff;border:0;border-radius:12px;font-weight:600;cursor:pointer;min-height:40px;padding:0 14px}
.linebtn svg{flex:none}
.linebtn.lg{min-height:52px;font-size:16px;border-radius:14px;width:100%}
/* hero */
.hero{margin:16px 0 4px;border-radius:22px;overflow:hidden;position:relative;background:var(--navy);color:#fff;min-height:200px;display:flex;align-items:flex-end}
.hero .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,37,69,.05) 0%,rgba(11,37,69,.88) 100%)}
.hero .waves{position:absolute;inset:auto 0 0 0;opacity:.35}
.hero .txt{position:relative;z-index:1;padding:22px}
.hero h1{margin:0 0 6px;font-size:26px;line-height:1.3;font-weight:700}
.hero p{margin:0 0 14px;color:#C9D8EA;font-size:14.5px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;min-height:40px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* sections */
h2.sec{font-size:18px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .more{margin-left:auto;font-size:13.5px;color:var(--blue);font-weight:500}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,42%);gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{scroll-snap-align:start}
@media (min-width:640px){.hscroll{grid-auto-columns:minmax(170px,31%)}}
@media (min-width:1024px){.hscroll{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;margin:0;padding:0;gap:16px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.98)}
.card.out{opacity:.62}
.ph{aspect-ratio:1/1;background:var(--surface-2);position:relative;display:grid;place-items:center;font-size:44px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.ph img.ok{opacity:1}
.st{position:absolute;left:8px;top:8px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.12);z-index:1}
.st.available{color:var(--green)} .st.low{color:var(--amber)} .st.soldout{color:var(--red)} .st.preorder{color:var(--blue)} .st.ask{color:var(--ink-2)}
.card .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.card .nm{font-weight:600;line-height:1.35}
.card .sz{font-size:12.5px;color:var(--ink-3)}
.card .pr{margin-top:auto;padding-top:6px;font-weight:700;color:var(--blue)}
.card .pr small{color:var(--ink-3);font-weight:400}
.new{position:absolute;left:8px;bottom:8px;background:var(--blue);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;z-index:1}
/* detail */
.dimg{margin:14px -16px 0;aspect-ratio:1/1;max-height:62vh;background:var(--surface-2);position:relative;display:grid;place-items:center;font-size:80px;overflow:hidden}
@media (min-width:600px){.dimg{margin:16px 0 0;border-radius:20px}}
.dimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dimg img.lq{filter:blur(8px);transform:scale(1.04)}
.d h1{font-size:24px;margin:16px 0 2px;line-height:1.3}
.d .sz{color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;border-radius:99px;padding:4px 12px;margin-top:10px}
.pill.available{background:var(--green-soft);color:var(--green)} .pill.low{background:var(--amber-soft);color:var(--amber)} .pill.soldout{background:var(--red-soft);color:var(--red)} .pill.preorder{background:var(--blue-soft);color:var(--blue)} .pill.ask{background:var(--surface-2);color:var(--ink-2)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px}
.box h3{margin:0 0 8px;font-size:15px}
.ptab{width:100%;border-collapse:collapse}
.ptab td{padding:8px 0;border-bottom:1px dashed var(--line)}
.ptab tr:last-child td{border-bottom:0}
.ptab td:last-child{text-align:right;font-weight:700}
.ptab .best td:last-child{color:var(--blue)}
.hl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.hl li{display:flex;gap:8px}.hl li::before{content:"✓";color:var(--green);font-weight:700}
.pre{white-space:pre-line;color:var(--ink-2)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.sticky .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.wsbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:14px;border:1.5px solid var(--navy);color:var(--navy);background:var(--surface);font-weight:600;width:100%}
@media (prefers-color-scheme:dark){.wsbtn{border-color:var(--ink-2);color:var(--ink)}}
.search{order:3;width:100%;position:relative}
.search input{width:100%;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:8px 12px 8px 38px;font:inherit;font-size:16px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
@media (min-width:900px){.search{order:0;flex:0 1 380px;margin-left:auto}.bar .grow{display:none}}
.more-i{font-size:12px;color:var(--blue);margin-top:4px;font-weight:500}
.upd{font-size:12.5px;color:var(--ink-3);margin:-4px 0 10px}
.price{font-size:24px;font-weight:700;color:var(--blue)} .price small{font-size:14px;color:var(--ink-3);font-weight:400}
.avgw{color:var(--ink-2);font-size:14px;margin-top:2px}
.ctas{display:none}
.pieces{display:flex;flex-direction:column;gap:8px}
.pc-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.pc-row .w{font-weight:700;min-width:70px}.pc-row .pp{font-weight:700;color:var(--blue);flex:1}
.pc-row a{flex:none;min-height:38px;padding:0 12px;font-size:14px}
.gchip{display:inline-block;background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:1px 9px;margin:2px 2px 0 0;font-weight:600;font-size:12px}
.pcs-line{font-size:12.5px;color:var(--green);font-weight:600;margin-top:2px}
@media (min-width:900px){
  .d{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start;padding-top:20px}
  .d .dimg{margin:0;border-radius:20px;position:sticky;top:90px}
  .d h1{margin-top:0}
  .sticky{display:none}.ctas{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .wrap.d{padding-bottom:60px}
}
.note{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:6px}
.foot{text-align:center;color:var(--ink-3);font-size:13px;margin:30px 0 0}
.empty{text-align:center;color:var(--ink-3);padding:40px 10px}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="sk" style="height:200px;margin-top:16px"></div><div class="grid" style="margin-top:16px"><div class="sk" style="height:220px"></div><div class="sk" style="height:220px"></div></div></div></div>
<script>
/* Taikong Seafood · Digital Menu (สาธารณะ ไม่ต้องล็อกอิน)
   อ่านเฉพาะ public/catalog และ public/catalog_images/{slug} ผ่าน Firebase REST — ไม่มีสิทธิ์อ่าน private
   ราคา: แสดงเฉพาะราคาปลีก · หน่วยขาย (unit) จาก catalog เป็น Source of Truth (kg หรือ ตัว) */
const DB_URL = 'https://taikong-seafood-back-office-default-rtdb.asia-southeast1.firebasedatabase.app';
const CAT_EMOJI = {'กุ้ง':'🦐', 'หมึก':'🦑', 'ปลา':'🐟', 'ปู':'🦀', 'อื่น ๆ':'🦪'};
const ST = {available:'🟢 มีสินค้า', low:'🟡 เหลือจำนวนจำกัด', soldout:'🔴 หมดชั่วคราว', preorder:'🔵 สั่งจองล่วงหน้า', ask:'💬 สอบถามทาง LINE'};
const ST_ORDER = {available:0, low:1, preorder:2, ask:3, soldout:4};
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const baht = n => { const v = Math.round((+n || 0) * 100) / 100; return '฿' + v.toLocaleString('th-TH', {minimumFractionDigits:Number.isInteger(v) ? 0 : 2, maximumFractionDigits:2}); };
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const LINE_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8-6C21.4 14.2 22 12.7 22 11c0-4.4-4.5-8-10-8z"/></svg>';
let CAT = null, LOADED_AT = 0;
const unit = p => p.unit === 'ตัว' ? 'ตัว' : 'kg';
const title = p => (p.name + (p.size ? ' ' + p.size : '')).trim();
const catKey = c => (CAT.list.find(p => p.category === c) || {}).cat_slug || c;

/* ---------- LINE ---------- */
function lineUrl(text) {
  const id = (CAT.meta.line_id || '').trim(); if (!id) return '';
  const acct = id.startsWith('@') ? id : '@' + id;
  return 'https://line.me/R/oaMessage/' + encodeURIComponent(acct).replace(/^%40/, '@') + '/?' + encodeURIComponent(text);
}
const MSG_ORDER = p => `สนใจ ${title(p)}\nต้องการสั่งซื้อ/สอบถามรายละเอียดค่ะ`;
const MSG_WHOLESALE = p => `สนใจขอราคาส่ง\n${title(p)}\nรบกวนแจ้งราคาส่งให้ด้วยค่ะ`;
const lineBtn = (text, cls = '') => { const u = lineUrl(text); return u ? `<a class="linebtn ${cls}" href="${esc(u)}" target="_blank" rel="noopener">${LINE_SVG} สั่งซื้อ / สอบถามผ่าน LINE</a>` : ''; };
const wsBtn = p => { const u = lineUrl(MSG_WHOLESALE(p)); return u ? `<a class="wsbtn" href="${esc(u)}" target="_blank" rel="noopener">🏷️ ขอราคาส่ง</a>` : ''; };

/* ---------- Data ---------- */
async function load() {
  const r = await fetch(DB_URL + '/public/catalog.json', {cache:'no-store'}); if (!r.ok) throw new Error('HTTP ' + r.status);
  const c = await r.json() || {}; c.meta = c.meta || {};
  c.list = Object.values(c.products || {}).filter(p => p && p.slug && p.name).map(p => ({...p, highlights:Object.values(p.highlights || {})}));
  c.list.sort((a, b) => (ST_ORDER[a.status] ?? 9) - (ST_ORDER[b.status] ?? 9) || (a.sort ?? 0) - (b.sort ?? 0));
  CAT = c; LOADED_AT = Date.now();
}
const IMGMEM = {};
async function getImg(slug, size, v) {
  const key = `tkimg:${slug}:${size}`, mem = IMGMEM[key]; if (mem && mem.v === v) return mem.data;
  try { const c = JSON.parse(localStorage.getItem(key) || 'null'); if (c && c.v === v) { IMGMEM[key] = c; return c.data; } } catch (e) {}
  const r = await fetch(`${DB_URL}/public/catalog_images/${encodeURIComponent(slug)}/${size}.json`); if (!r.ok) return null;
  const j = await r.json(); if (!j || typeof j.data !== 'string' || !j.data.startsWith('data:image/')) return null;
  const rec = {v, data:j.data}; IMGMEM[key] = rec;
  try { localStorage.setItem(key, JSON.stringify(rec)); } catch (e) { try { Object.keys(localStorage).filter(k => k.startsWith('tkimg:')).forEach(k => localStorage.removeItem(k)); } catch (_) {} }
  return rec.data;
}
let IO = null;
function lazyImages() {
  if (IO) IO.disconnect();
  const show = async el => { const d = await getImg(el.dataset.slug, el.dataset.size, +el.dataset.v); if (d) { el.onload = () => el.classList.add('ok'); el.src = d; } };
  const els = document.querySelectorAll('img[data-slug]:not([src])');
  if (!('IntersectionObserver' in window)) return els.forEach(show);
  IO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { IO.unobserve(e.target); show(e.target); } }), {rootMargin:'300px'});
  els.forEach(el => IO.observe(el));
}

/* ---------- Helpers ---------- */
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); };
const isNew = p => !!p.last_received && p.last_received >= daysAgo(1);          // เข้าวันนี้หรือเมื่อวาน (จากวันที่รับ Lot จริง)
function updatedText() {
  const t = CAT.meta.stock_updated_at; if (!t) return '';
  const d = new Date(t); if (isNaN(d)) return '';
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' น.';
  return 'อัปเดตล่าสุด ' + (ymd(d) === ymd(new Date()) ? hm : `${d.getDate()} ${TH_M[d.getMonth()]} ${hm}`);
}
const methods = p => Object.values(p.methods || {}).filter(x => x && x.price > 0);
const MT = {WEIGHT:'⚖️ ตามน้ำหนัก (ชั่งจริง)', SIZE_GRADE_WEIGHT:'📏 ตามไซซ์', PIECE_ACTUAL_WEIGHT:'🐟 ขายเป็นตัว · คิดตามน้ำหนักจริง'};
const grades = p => Object.values(p.grades || {}).filter(Boolean);
const gradeHtml = p => grades(p).length > 1 ? `ไซซ์ในสต็อก: ${grades(p).map(esc).join(' · ')}` : '';
const allPrices = p => methods(p).flatMap(x => { const ss = Object.values(x.sizes || {}); return ss.length ? ss.map(s => s.price) : [x.price]; }).filter(v => v > 0);
const priceHtml = p => { const ps = allPrices(p); if (!ps.length) return p.retail_price > 0 ? `${baht(p.retail_price)}<small> / kg</small>` : '<small>สอบถามราคา</small>';
  const lo = Math.min(...ps), hi = Math.max(...ps); return `${baht(lo)}${hi > lo ? '–' + baht(hi).slice(1) : ''}<small> / kg</small>`; };
const fmtG = g => g >= 1000 ? (g / 1000).toLocaleString('th-TH', {maximumFractionDigits:3}) + ' kg' : g + ' g';
const pieces = p => Object.values(p.pieces || {}).filter(x => x && x.g > 0);
const MSG_PIECE = (p, x) => `สนใจ ${title(p)}\n${p.pieces_by || 'ขายเป็นตัว'} · ตัว ${fmtG(x.g)}${x.grade ? ' ' + x.grade : ''} (${baht(x.price)})\nต้องการสั่งซื้อค่ะ`;
const MSG_SIZE = (p, mm, s) => `สนใจ ${p.name}\nไซซ์ ${s.grade} (${baht(s.price)}/kg)\nต้องการสั่งซื้อ/สอบถามรายละเอียดค่ะ`;
const MSG_METHOD = (p, mm) => `สนใจ ${title(p)}\nแบบ: ${mm.name} (${baht(mm.price)}/kg)\nต้องการสั่งซื้อ/สอบถามรายละเอียดค่ะ`;
const avgHtml = p => p.avg_piece_g > 0 ? `น้ำหนักประมาณ ${p.avg_piece_g >= 1000 ? (p.avg_piece_g / 1000).toLocaleString('th-TH', {maximumFractionDigits:2}) + ' kg' : p.avg_piece_g + ' g'}/ตัว` : '';
function card(p) {
  return `<a class="card ${p.status === 'soldout' ? 'out' : ''}" href="?p=${encodeURIComponent(p.slug)}" data-nav aria-label="${esc(title(p))} ดูรายละเอียด">
    <div class="ph">${CAT_EMOJI[p.category] || '🐟'}${p.image_v ? `<img alt="${esc(p.name)}" data-slug="${esc(p.slug)}" data-size="thumb" data-v="${p.image_v}">` : ''}<span class="st ${esc(p.status)}">${ST[p.status] || ''}</span>${isNew(p) ? '<span class="new">เข้าใหม่</span>' : ''}</div>
    <div class="b"><div class="nm">${esc(p.name)}</div>${p.size ? `<div class="sz">${esc(p.size)}</div>` : ''}${gradeHtml(p) ? `<div class="sz">${gradeHtml(p)}</div>` : ''}${avgHtml(p) ? `<div class="sz">${avgHtml(p)}</div>` : ''}
      ${(() => { const n = methods(p).reduce((s, x) => s + (Object.values(x.sizes || {}).length || 1), 0); const ss = methods(p).flatMap(x => Object.values(x.sizes || {})); return ss.length > 1 ? `<div class="sz">${ss.length} ไซซ์${n > ss.length ? ' · ' + (n - ss.length) + ' วิธีขายอื่น' : ''}</div>` : n > 1 ? `<div class="sz">${n} วิธีขาย</div>` : ''; })()}<div class="pr num">${priceHtml(p)}</div>${pieces(p).length ? `<div class="pcs-line">🐟 เลือกตัวได้ ${pieces(p).length} ตัว</div>` : ''}<div class="more-i">ดูรายละเอียด ›</div></div></a>`;
}
function topbar(back, q = '') {
  const m = CAT.meta;
  return `<header class="bar"><div class="in">${back ? `<button class="back" onclick="goBack()" aria-label="ย้อนกลับ">‹ กลับ</button>` : `<a href="./" data-nav style="display:flex;gap:10px;align-items:center"><div class="logo">${m.logo && m.logo.startsWith('data:image/') ? `<img src="${m.logo}" alt="">` : '🦐'}</div><div class="brand"><b>${esc(m.name_en || 'TAIKONG SEAFOOD')}</b><small>${esc(m.name || 'ไต้ก๋ง ซีฟู้ด')}</small></div></a>`}
    <div class="grow"></div><label class="search"><span class="sr" style="position:absolute;left:-9999px">ค้นหาสินค้า</span><input id="q" type="search" enterkeyhint="search" placeholder="ค้นหา เช่น หมึก, กุ้ง, 4–6 ตัว" value="${esc(q)}" oninput="onSearch(this.value)" autocomplete="off"></label>
    ${lineUrl('') ? `<a class="linebtn" href="${esc(lineUrl('สวัสดีค่ะ สนใจสั่งของทะเล'))}" target="_blank" rel="noopener" aria-label="LINE">${LINE_SVG} LINE</a>` : ''}</div></header>`;
}
function chips(active) {
  const cats = [...new Set(CAT.list.map(p => p.category).filter(Boolean))];
  return `<nav class="chips" aria-label="หมวดสินค้า"><a class="chip ${active === 'all' ? 'on' : ''}" href="?c=all" data-nav>ทั้งหมด</a>${cats.map(c => `<a class="chip ${active === c ? 'on' : ''}" href="?c=${encodeURIComponent(catKey(c))}" data-nav>${CAT_EMOJI[c] || ''} ${esc(c)}</a>`).join('')}</nav>`;
}
const legend = () => `<div class="legend"><span>${ST.available}</span><span>${ST.low}</span><span>${ST.soldout}</span></div>`;
const grid = L => L.length ? `<div class="grid" style="margin-top:12px">${L.map(card).join('')}</div>` : '<div class="empty">ไม่พบสินค้า</div>';

/* ---------- Views ---------- */
function vHome() {
  const m = CAT.meta, L = CAT.list;
  const fresh = L.filter(p => p.last_received && ['available', 'low'].includes(p.status)).sort((a, b) => b.last_received.localeCompare(a.last_received)).slice(0, 8);
  const feat = L.filter(p => p.featured).slice(0, 8);
  const hero = m.hero_image && /^[\w./-]+$/.test(m.hero_image) ? `<img class="bgimg" src="../${esc(m.hero_image.replace(/^\.?\//, ''))}" alt="" onerror="this.remove()">` : '';
  return `${topbar(false)}<main class="wrap">
    <section class="hero">${hero}<svg class="waves" viewBox="0 0 400 80" preserveAspectRatio="none" width="100%" height="80" aria-hidden="true"><path d="M0 40 Q50 10 100 40 T200 40 T300 40 T400 40 V80 H0Z" fill="#1668E3"/><path d="M0 55 Q50 30 100 55 T200 55 T300 55 T400 55 V80 H0Z" fill="#4C8FF5" opacity=".6"/></svg>
      <div class="txt"><h1>${esc(m.tagline || 'ของทะเลสด คัดเกรด แช่แข็งพร้อมส่ง')}</h1><p>เลือกดูสินค้าและราคา แล้วทักสั่งซื้อทาง LINE ได้เลย</p>${lineUrl('') ? `<a class="linebtn" href="${esc(lineUrl('สวัสดีค่ะ สนใจสั่งของทะเล'))}" target="_blank" rel="noopener">💬 สั่งซื้อ / สอบถามผ่าน LINE</a>` : ''}</div></section>
    ${chips('')}
    ${fresh.length ? `<h2 class="sec">🌊 ของทะเลวันนี้<a class="more" href="?c=all" data-nav>ดูทั้งหมด ›</a></h2><div class="upd">สินค้าที่พร้อมส่งจากสต็อกล่าสุด${updatedText() ? ' · ' + updatedText() : ''}</div><div class="hscroll">${fresh.map(card).join('')}</div>` : ''}
    ${feat.length ? `<h2 class="sec">⭐ สินค้าแนะนำ</h2><div class="hscroll">${feat.map(card).join('')}</div>` : ''}
    <h2 class="sec">สินค้าทั้งหมด <span style="font-weight:400;color:var(--ink-3);font-size:14px">${L.length} รายการ</span></h2>${legend()}
    ${L.length ? grid(L) : '<div class="empty">ยังไม่มีสินค้าในเมนู</div>'}
    <p class="foot">${esc(m.name || 'ไต้ก๋ง ซีฟู้ด')}${m.phone ? ' · ' + esc(m.phone) : ''}${m.line_id ? ' · LINE ' + esc(m.line_id) : ''}<br>ราคาปลีก · สนใจราคาส่งทักสอบถามทาง LINE</p></main>`;
}
function catFromParam(c) { if (c === 'all') return 'all'; const cats = [...new Set(CAT.list.map(p => p.category))]; return cats.find(x => x === c || catKey(x) === c) || c; }
function vList(c) {
  const cat = catFromParam(c), L = cat === 'all' ? CAT.list : CAT.list.filter(p => p.category === cat);
  return `${topbar(true)}<main class="wrap"><h2 class="sec" style="margin-top:16px">${cat === 'all' ? 'สินค้าทั้งหมด' : (CAT_EMOJI[cat] || '') + ' ' + esc(cat)}</h2>${chips(cat)}${legend()}${grid(L)}</main>`;
}
const norm = s => String(s || '').toLowerCase().replace(/[\s\-–—]+/g, '');
function vSearch(q) {
  const n = norm(q), L = CAT.list.filter(p => [p.name, p.size, p.category, ...grades(p)].some(x => norm(x).includes(n)));
  return `${topbar(true, q)}<main class="wrap"><h2 class="sec" style="margin-top:16px">ผลการค้นหา “${esc(q)}” <span style="font-weight:400;color:var(--ink-3);font-size:14px">${L.length} รายการ</span></h2>${chips('')}${grid(L)}</main>`;
}
function vDetail(slug) {
  const p = CAT.list.find(x => x.slug === slug);
  if (!p) return `${topbar(true)}<main class="wrap"><div class="empty">ไม่พบสินค้านี้ หรือสินค้าถูกนำออกจากเมนูแล้ว<br><br><a class="chip on" href="?c=all" data-nav>ดูสินค้าทั้งหมด</a></div></main>`;
  const m = CAT.meta, u = unit(p);
  const ship = [m.carrier && m.shipping_fee ? `${m.carrier} ${baht(m.shipping_fee)}` : m.shipping_fee ? `ค่าส่งเริ่มต้น ${baht(m.shipping_fee)}` : '', m.shipping_text].filter(Boolean).join('\n');
  document.title = `${title(p)} · ${m.name || 'ไต้ก๋ง ซีฟู้ด'}`;
  setTimeout(async () => { if (!p.image_v) return; const el = $('#dimg'); const th = await getImg(p.slug, 'thumb', p.image_v); if (th && el && !el.dataset.full) el.insertAdjacentHTML('beforeend', `<img class="lq" src="${th}" alt="">`);
    const lg = await getImg(p.slug, 'large', p.image_v); if (lg && el) { el.dataset.full = 1; el.innerHTML = `<img src="${lg}" alt="${esc(p.name)}">`; } }, 0);
  const ctas = `${lineBtn(MSG_ORDER(p), 'lg')}${wsBtn(p)}`;
  return `${topbar(true)}<main class="wrap d">
    <div class="dimg" id="dimg">${CAT_EMOJI[p.category] || '🐟'}</div>
    <div>
      <h1>${esc(p.name)}</h1>${p.size ? `<div class="sz">${esc(p.size)}</div>` : ''}${gradeHtml(p) ? `<div class="sz">${gradeHtml(p)}</div>` : ''}
      <span class="pill ${esc(p.status)}">${ST[p.status] || ''}</span>
      <div class="box"><h3>วิธีขาย · ราคาปลีก</h3><div class="pieces">${(methods(p).length ? methods(p) : [{name:'ราคาปลีก', type:'WEIGHT', price:p.retail_price}]).map(mm => { const ss = Object.values(mm.sizes || {});
        if (ss.length) return `<div class="small" style="color:var(--ink-2);font-weight:600;margin-top:4px">${MT[mm.type] || ''} ${mm.name && mm.name !== 'ตามไซซ์' ? '· ' + esc(mm.name) : ''}</div>${ss.map(s => { const u = lineUrl(MSG_SIZE(p, mm, s));
          return `<div class="pc-row" style="flex-wrap:wrap"><span style="flex:1;min-width:130px"><b>${esc(s.grade)}</b><div class="small"><span class="pill ${esc(s.status)}" style="margin:2px 0 0;font-size:11.5px;padding:1px 8px">${ST[s.status] || ''}</span></div></span><span class="pp num" style="flex:none">${baht(s.price)}<small style="color:var(--ink-3);font-weight:400"> / kg</small></span>${u && s.status !== 'soldout' ? `<a class="linebtn" href="${esc(u)}" target="_blank" rel="noopener">${LINE_SVG} สั่งไซซ์นี้</a>` : ''}</div>`; }).join('')}`;
        const u = lineUrl(MSG_METHOD(p, mm)), gs = mm.type === 'WEIGHT' ? grades(p).length ? grades(p) : (p.size ? [p.size] : []) : [];
        const fishHere = mm.type === 'WEIGHT' && pieces(p).length && p.pieces_by === mm.name;
        return `<div class="pc-row" style="flex-wrap:wrap"><span style="flex:1;min-width:150px"><b>${esc(mm.name)}</b><div class="small" style="color:var(--ink-3)">${MT[mm.type] || ''}</div>${gs.length ? `<div class="small" style="margin-top:4px;color:var(--ink-2)">ไซซ์ที่มีตอนนี้: ${gs.map(g => `<span class="gchip">${esc(g)}</span>`).join(' ')}</div>` : ''}${fishHere ? `<div class="small" style="margin-top:4px;color:var(--green);font-weight:600">🐟 มีปลาชั่งรายตัว ${pieces(p).length} ตัว ให้เลือกด้านล่าง</div>` : ''}</span><span class="pp num" style="flex:none">${baht(mm.price)}<small style="color:var(--ink-3);font-weight:400"> / kg</small></span>${u ? `<a class="linebtn" href="${esc(u)}" target="_blank" rel="noopener">${LINE_SVG} สั่งแบบนี้</a>` : ''}</div>`; }).join('')}</div>
        ${avgHtml(p) ? `<div class="avgw" style="margin-top:8px">${avgHtml(p)}</div>` : ''}<div class="note" style="text-align:left;margin-top:8px">ราคาคิดตามน้ำหนักจริง · ต้องการซื้อจำนวนมาก กด “🏷️ ขอราคาส่ง” เพื่อสอบถามทาง LINE</div></div>
      ${pieces(p).length ? `<div class="box"><h3>🐟 เลือกตัวได้ (${pieces(p).length} ตัว)</h3><p class="note" style="text-align:left;margin:0 0 10px">ชั่งไว้แล้ว · ราคาต่อตัว = น้ำหนักจริง × ราคา${esc(p.pieces_by || 'ขายเป็นตัว')} ${(() => { const mm = methods(p).find(x => x.name === p.pieces_by); return mm ? baht(mm.price) + '/kg' : ''; })()}</p><div class="pieces">${pieces(p).map(x => { const u = lineUrl(MSG_PIECE(p, x)); return `<div class="pc-row"><span class="w num">${fmtG(x.g)}${x.grade && grades(p).length > 0 ? `<div style="font-weight:400;font-size:12px;color:var(--ink-3)">${esc(x.grade)}</div>` : ''}</span><span class="pp num">${baht(x.price)}</span>${u ? `<a class="linebtn" href="${esc(u)}" target="_blank" rel="noopener">${LINE_SVG} สั่งตัวนี้</a>` : ''}</div>`; }).join('')}</div></div>` : ''}
      ${p.description ? `<div class="box"><h3>รายละเอียด</h3><div class="pre">${esc(p.description)}</div></div>` : ''}
      ${p.highlights.length ? `<div class="box"><h3>จุดเด่น</h3><ul class="hl">${p.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul></div>` : ''}
      ${m.packing_text ? `<div class="box"><h3>📦 การแพ็ก</h3><div class="pre">${esc(m.packing_text)}</div></div>` : ''}
      ${ship ? `<div class="box"><h3>🚚 ค่าจัดส่ง</h3><div class="pre">${esc(ship)}</div></div>` : ''}
      ${lineUrl('') ? `<div class="ctas">${ctas}${p.status === 'soldout' ? '<div class="note">สินค้าหมดชั่วคราว · ทักถามรอบเข้าของถัดไปได้</div>' : ''}</div>` : ''}
    </div>
  </main>
  ${lineUrl('') ? `<div class="sticky"><div class="in">${ctas}</div></div>` : ''}`;
}

/* ---------- Router ---------- */
function render() {
  const q = new URLSearchParams(location.search), app = $('#app');
  if (!q.get('p')) document.title = (CAT.meta.name || 'ไต้ก๋ง ซีฟู้ด') + ' · เมนูของทะเล';
  app.innerHTML = q.get('p') ? vDetail(q.get('p')) : q.get('q') ? vSearch(q.get('q')) : q.get('c') ? vList(q.get('c')) : vHome();
  lazyImages();
}
let ST_T = null;
function onSearch(v) {
  clearTimeout(ST_T); ST_T = setTimeout(() => {
    const val = v.trim(), url = val ? '?q=' + encodeURIComponent(val) : './';
    const wasSearch = new URLSearchParams(location.search).has('q');
    history[wasSearch ? 'replaceState' : 'pushState']({}, '', url); render();
    const i = $('#q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }, 250);
}
function nav(href) { history.pushState({}, '', href); render(); scrollTo(0, 0); }
function goBack() { if (history.state && history.length > 1) history.back(); else nav('./'); }
document.addEventListener('click', e => { const a = e.target.closest('a[data-nav]'); if (!a || e.metaKey || e.ctrlKey) return; e.preventDefault(); nav(a.getAttribute('href')); });
addEventListener('popstate', render);
document.addEventListener('visibilitychange', async () => { if (!document.hidden && CAT && Date.now() - LOADED_AT > 60000) { try { await load(); const y = scrollY; const f = document.activeElement && document.activeElement.id === 'q'; render(); scrollTo(0, y); if (f) $('#q').focus(); } catch (e) {} } });
(async function start() {
  try { await load(); render(); }
  catch (e) { $('#app').innerHTML = `<div class="wrap"><div class="empty">โหลดเมนูไม่สำเร็จ<br><span style="font-size:13px">ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</span><br><br><button class="chip on" onclick="location.reload()">ลองใหม่</button></div></div>`; }
})();
</script>
</body>
</html>
