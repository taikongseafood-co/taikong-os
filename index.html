  const rows = o.items.map((i, k) => ({i, k, p:P(i.product_id)})).filter(x => x.i.needs_weigh && !(x.i.piece_ids || []).length);
  window.__wo = oid;
  modal('⚖️ ชั่งน้ำหนักจริง · ' + o.order_number, `<p class="small muted" style="margin-top:0">ใส่น้ำหนักและจำนวนตัวที่แพ็กจริง ระบบคำนวณราคา = น้ำหนัก × ราคา/kg แล้วตัดสต็อกตามจริง</p>
    <div class="stack" style="gap:12px">${rows.map(({i, k, p}) => `<div class="note"><b>${esc(i.product_name)}</b> · ${baht(i.selling_price)}/kg${i.req_pcs ? ` · สั่ง ${i.req_pcs} ตัว` : ''}${i.weighed ? ' <span class="tag gr">ชั่งแล้ว</span>' : ' <span class="tag or">รอชั่ง</span>'}
      <div class="fgrid" style="margin-top:8px"><label class="f">น้ำหนักจริง (kg)<input class="in num wg" data-k="${k}" type="number" inputmode="decimal" step="0.001" min="0" value="${i.weighed && i.actual_g ? i.actual_g / 1000 : ''}" placeholder="${(+i.quantity || 0).toFixed(3)}" oninput="wSum()"></label>
      ${tracksPcs(p) ? `<label class="f">จำนวนตัวจริง<input class="in num wp" data-k="${k}" type="number" inputmode="numeric" min="0" step="1" value="${i.weighed ? (i.actual_pcs || '') : (i.req_pcs || '')}" oninput="wSum()"></label>` : ''}</div>
      <div class="small" id="ws${k}"></div></div>`).join('')}</div>`, `<button class="btn pri" onclick="saveWeigh()">บันทึกน้ำหนักจริง</button>`);
  wSum();
}
function wSum() { const o = DB.orders.find(x => x.id === window.__wo); $$('#ov .wg').forEach(el => { const k = +el.dataset.k, i = o.items[k], g = toG(el.value); const s = $('#ws' + k); if (s) s.innerHTML = g > 0 ? `${fmtW(g)} × ${baht(i.selling_price)}/kg = <b class="num">${baht(priceOfG(g, i.selling_price))}</b>` : ''; }); }
function saveWeigh() {
  const o = DB.orders.find(x => x.id === window.__wo); let bad = '';
  $$('#ov .wg').forEach(el => { const k = +el.dataset.k, i = o.items[k], g = toG(el.value), pe = $(`#ov .wp[data-k="${k}"]`), pc = pe ? Math.round(+pe.value || 0) : 0;
    if (!(g > 0)) { bad = 'ใส่น้ำหนักจริงให้ครบทุกรายการ'; return; } if (pe && !(pc > 0)) { bad = 'ใส่จำนวนตัวจริง'; return; }
    i.actual_g = g; i.actual_pcs = pc; i.weighed = true; i.quantity = g / 1000; });
  if (bad) return toast(bad);
  calcOrder(o); o.updated_at = new Date().toISOString(); o.updated_by = USER?.email || '';
  save(); closeModal(); toast('บันทึกน้ำหนักจริงแล้ว · ยอดชำระ ' + baht(o.total)); render();
}

/* ----- ปลารายตัว: ปลดเป็นของรวม / เสีย ----- */
function poolPiece(pid, id) {
  const pc = pieceStates(pid).find(x => x.id === id); if (!pc || pc.state !== 'available') return toast('ทำได้เฉพาะตัวที่ยังว่าง');
  confirmModal(`ปลดปลาตัว <b>${fmtW(pc.g)}</b> (${pc.lot_code}) ไปเป็นของรวม?<br><span class="small muted">ยังนับเป็น 1 ตัวและน้ำหนักเท่าเดิม แต่จะไม่แสดงเป็นรายตัวในเมนู · ใช้ขายแบบไม่ระบุตัว (ชั่งกิโล / ตามไซซ์ / ระบุจำนวนตัว)</span>`, 'ปลดเป็นของรวม', () => {
    const lot = DB.stock_lots.find(l => l.id === pc.lot_id); const x = lot.pieces.find(q => q.id === id); x.out = 'pooled'; x.out_at = new Date().toISOString();
    mv({type:'ADJUSTMENT', product_id:pid, lot_id:lot.id, piece_id:id, grams:0, pcs:0, reason:`ปลดปลาตัว ${fmtW(pc.g)} เป็นของรวม`}); save(); render(); toast('ปลดเป็นของรวมแล้ว'); });
}
function spoilPiece(pid, id) {
  const pc = pieceStates(pid).find(x => x.id === id); if (!pc || pc.state !== 'available') return toast('ทำได้เฉพาะตัวที่ยังว่าง');
  confirmModal(`บันทึกปลาตัว <b>${fmtW(pc.g)}</b> (${pc.lot_code}) ว่า <b>เสีย / คัดทิ้ง</b>?`, 'บันทึกว่าเสีย', () => {
    const lot = DB.stock_lots.find(l => l.id === pc.lot_id); const x = lot.pieces.find(q => q.id === id); x.out = 'spoiled'; x.out_at = new Date().toISOString();
    mv({type:'SPOILAGE', product_id:pid, lot_id:lot.id, piece_id:id, grams:-pc.g, pcs:-1, reason:`เสีย / คัดทิ้ง · ตัว ${fmtW(pc.g)}`}); clampAlloc(pid); save(); render(); toast('บันทึกแล้ว'); }, true);
}
const PSTATE = {available:['ว่าง', 'tag gr'], reserved:['จองแล้ว', 'tag blue'], sold:['ขายแล้ว', 'tag'], pooled:['เป็นของรวม', 'tag or'], spoiled:['เสีย', 'tag']};
function piecesSection(p) {
  const ord = {available:0, reserved:1, sold:2, pooled:3, spoiled:4}, ps = pieceStates(p.id).sort((a, b) => ord[a.state] - ord[b.state] || b.g - a.g);
  const free = countSellable(p.id), pm = methodsOf(p).find(m => m.type === 'PIECE_ACTUAL_WEIGHT'), av = ps.filter(x => x.state === 'available').length;
  return `<div class="card"><div class="hd"><h3>🐟 ตัว + น้ำหนัก</h3><div class="grow"></div><span class="small muted">ปลารายตัวว่าง ${av} ตัว · ของรวม ${free.pc} ตัว ${fmtW(free.g)}</span></div>
    ${ps.length ? `<div class="tw"><table class="t cards"><thead><tr><th>ปลารายตัว</th><th>ไซซ์ Lot</th><th class="r">${pm ? `ราคา (${pm.name} ฿${n2(pm.price)}/kg)` : 'ราคา'}</th><th>Lot</th><th>สถานะ</th><th></th></tr></thead><tbody>
    ${ps.map(x => { const o = x.order_id ? DB.orders.find(z => z.id === x.order_id) : null;
      const lg = (DB.stock_lots.find(l => l.id === x.lot_id) || {}).grade || '';
      return `<tr><td><b class="num">${fmtW(x.g)}</b></td><td class="small">${esc(lg) || '<span class="muted">—</span>'}</td><td class="r num">${pm ? baht(priceOfG(x.g, pm.price)) : '—'}</td><td class="small muted num">${x.lot_code}</td><td><span class="${PSTATE[x.state][1]}">${PSTATE[x.state][0]}</span>${o ? ` <a class="small num" href="#/order/${o.order_number}">${o.order_number}</a>` : ''}</td>
      <td class="r">${x.state === 'available' ? `<div class="row" style="justify-content:flex-end;gap:6px;flex-wrap:nowrap"><button class="btn sm" onclick="poolPiece('${p.id}','${x.id}')">ปลดเป็นของรวม</button><button class="btn sm ghost danger" onclick="spoilPiece('${p.id}','${x.id}')">เสีย</button></div>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<p class="small muted" style="margin:0">ยังไม่มีปลาที่ชั่งรายตัว · รับเข้าแบบ "ชั่งรายตัว" ถ้าต้องการให้ลูกค้าเลือกตัวได้</p>'}</div>`;
}

/* ---------- Render ---------- */
function render() {
  if (!READY || !DB) { $('#root').innerHTML = authScreen(); return; }
  const {parts, q} = route(); const root = $('#root'); let html;
  switch (parts[0]) {
    case 'orders': html = vOrders(q); break;
    case 'order':
      if (parts[1] === 'new') html = vOrderForm(null);
      else if (parts[2] === 'edit') html = vOrderForm(O(parts[1]));
      else { F = null; html = vOrderDetail(O(parts[1])); }
      break;
    case 'o': html = vPublic(parts[1]); break;
    case 'print': html = vPrint(q); break;
    case 'yield': html = vYield(); break;
    case 'stock': html = parts[1] ? vStockProduct(parts[1]) : vStock(); break;
    case 'cost': html = vCost(); break;
    case 'products': html = vProducts(q); break;
    case 'customers': html = vCustomers(q); break;
    case 'customer': html = vCustomer(parts[1]); break;
    case 'tracking': html = vTracking(q); break;
    case 'reports': html = vReports(); break;
    case 'settings': html = vSettings(); break;
    default: html = vDashboard();
  }
  const y = scrollY; const same = root.dataset.view === location.hash; root.innerHTML = html; root.dataset.view = location.hash; if (!['print', 'o'].includes(parts[0])) LAST = location.hash || '#/dashboard'; document.body.classList.toggle('printing', parts[0] === 'print');
  if (same) scrollTo(0, y); else scrollTo(0, 0);
}
try { const t = localStorage.getItem(KEY + '-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
/* ---------- Auth + boot ---------- */
const IDLE_MS = 30 * 60 * 1000; let STOP = null, AUTHSTATE = 'loading', AUTHERR = '';
function authScreen() {
  const s = AUTHSTATE;
  const body = s === 'loading' ? '<p class="muted">กำลังตรวจสอบการเข้าสู่ระบบ…</p>'
    : s === 'denied' ? `<p>บัญชี <b>${esc(AUTHERR)}</b> ไม่มีสิทธิ์เข้าหลังบ้าน</p>${DENY_WHY === 'rules' ? '<p class="small" style="color:var(--red)">ระบบตรวจสิทธิ์ไม่ได้ (permission denied) · เจ้าของร้านต้องอัปเดต Security Rules เวอร์ชันล่าสุดใน Firebase</p>' : '<p class="small muted">อีเมลนี้ยังไม่อยู่ในรายชื่อผู้ช่วย · ขอให้เจ้าของร้านเพิ่ม <b>อีเมลนี้ตรงตัวอักษร</b> ใน Settings → ผู้ใช้งาน</p>'}<button class="btn lg" style="width:100%" onclick="Backend.signOut()">ใช้บัญชีอื่น</button>`
    : s === 'syncing' ? '<p class="muted">กำลังโหลดข้อมูลร้าน…</p>'
    : `<p class="muted" style="margin-top:0">สำหรับเจ้าของร้านเท่านั้น</p><button class="btn pri lg" style="width:100%" onclick="login()"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg> เข้าสู่ระบบด้วย Google</button>${AUTHERR ? `<p class="small" style="color:var(--red);margin-top:12px">${esc(AUTHERR)}</p>` : ''}`;
  return `<div class="login"><div class="login-card"><div class="brand-mark" style="width:56px;height:56px;font-size:30px;border-radius:16px;margin:0 auto 14px">🦐</div><h1>TAIKONG SEAFOOD</h1><div class="muted small" style="margin-bottom:22px">ไต้ก๋ง ซีฟู้ด · หลังบ้าน</div>${body}</div><p class="small muted" style="text-align:center;margin-top:16px">🔒 ข้อมูลเข้ารหัสระหว่างส่ง และอ่านได้เฉพาะบัญชีเจ้าของร้าน</p></div>`;
}
async function login() {
  AUTHERR = ''; try { await Backend.signIn(); } catch (e) { if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') { AUTHERR = 'เข้าสู่ระบบไม่สำเร็จ (' + (e.code || e.message) + ')'; render(); } }
}
function logout() { try { localStorage.removeItem(KEY + '-act'); } catch (e) {} Backend.signOut(); }
function markActive() { try { localStorage.setItem(KEY + '-act', String(Date.now())); } catch (e) {} }
function idleExpired() { try { const t = +localStorage.getItem(KEY + '-act'); return t && Date.now() - t > IDLE_MS; } catch (e) { return false; } }
['click', 'keydown', 'touchstart', 'scroll'].forEach(ev => addEventListener(ev, () => { if (USER) markActive(); }, {passive:true}));
setInterval(() => { if (USER && idleExpired()) { toast('ล็อกอัตโนมัติ เพราะไม่ได้ใช้งานเกิน 30 นาที'); logout(); } }, 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && USER && idleExpired()) logout(); });

function boot() {
  const token = new URLSearchParams(location.search).get('o');
  if (token) return renderPublicToken(token);           // หน้าลูกค้า: ไม่ต้องล็อกอิน อ่านได้เฉพาะออเดอร์ของ token นี้
  render();
  Backend.onConnected && Backend.onConnected(on => { const ch = on !== ONLINE; ONLINE = on; if (ch && READY) render(); });
  let stopRole = null;
  Backend.onAuth(async u => {
    if (STOP) { STOP(); STOP = null; } if (stopRole) { stopRole(); stopRole = null; }
    READY = false; DB = null; LASTFLAT = {}; ROLE = null; ADMINS = {};
    if (!u) { USER = null; AUTHSTATE = 'signedout'; return render(); }
    const email = (u.email || '').toLowerCase();
    if (!u.emailVerified) { USER = null; AUTHSTATE = 'denied'; AUTHERR = email; return render(); }
    if (email === OWNER_EMAIL) ROLE = 'owner';
    else { AUTHSTATE = 'loading'; render();
      let rec = null; DENY_WHY = '';
      try { rec = await Backend.get('admins/' + emailKey(email)); if (!rec) DENY_WHY = 'notlisted'; }
      catch (e) { DENY_WHY = 'rules'; console.error(e); }
      if (!rec) { USER = null; AUTHSTATE = 'denied'; AUTHERR = email; return render(); }
      ROLE = 'staff'; }
    if (idleExpired()) { AUTHERR = 'ล็อกอัตโนมัติ เพราะไม่ได้ใช้งานเกิน 30 นาที'; return logout(); }
    USER = u; markActive(); AUTHSTATE = 'syncing'; render();
    // เจ้าของร้าน: ดูรายชื่อผู้ช่วย · ผู้ช่วย: ถ้าถูกเอาออก → ออกจากระบบทันที
    stopRole = ROLE === 'owner'
      ? Backend.on('admins', v => { ADMINS = v || {}; ADMINS_ERR = ''; if (READY && location.hash.startsWith('#/settings')) render(); }, e => { ADMINS_ERR = e.code || e.message || 'permission_denied'; if (READY) render(); })
      : Backend.on('admins/' + emailKey(email), v => { if (!v) { AUTHERR = 'สิทธิ์การเข้าใช้งานของคุณถูกยกเลิกแล้ว'; logout(); } }, () => logout());
    const stopCat = Backend.on('public/catalog', v => { SERVER_CAT = v || null; scheduleHeal(); }, () => {});
    const stopMain = Backend.listen(onRemote, e => { AUTHSTATE = 'signedout'; AUTHERR = 'อ่านข้อมูลไม่ได้ (' + (e.code || e.message) + ') ตรวจสอบ Security Rules'; USER = null; render(); });
    STOP = () => { stopMain(); stopCat(); SERVER_CAT = undefined; clearTimeout(HEAL_T); };
  });
}
boot();
</script>
