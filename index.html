<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta property="og:title" content="ไต้ก๋ง ซีฟู้ด · ใบสรุปออเดอร์">
<meta property="og:description" content="ดูรายการสินค้า ยอดชำระ และเลขพัสดุของคุณ">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ไต้ก๋ง">
<meta name="application-name" content="ไต้ก๋ง">
<meta name="theme-color" content="#0B2545">
<title>ไต้ก๋ง ซีฟู้ด · หลังบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF5FC; --surface:#FFFFFF; --surface-2:#F6FAFE; --line:#D9E6F3; --line-2:#C4D7EB;
  --ink:#0B2545; --ink-2:#3C5573; --ink-3:#7489A3;
  --blue:#1668E3; --blue-2:#0F55BD; --blue-soft:#E3EEFD; --navy:#0B2545; --navy-2:#13335C;
  --red:#D83A3A; --red-soft:#FDECEC; --orange:#E07A12; --orange-soft:#FDF1E3;
  --green:#12925B; --green-soft:#E3F5EC; --grey-soft:#EEF1F5;
  --shadow:0 1px 2px rgba(11,37,69,.06),0 4px 16px rgba(11,37,69,.05);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --font:'IBM Plex Sans','IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --display:'IBM Plex Sans','IBM Plex Sans Thai',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#07172B; --surface:#0E2340; --surface-2:#112A4B; --line:#1E3A60; --line-2:#2A4A74;
  --ink:#EAF2FC; --ink-2:#B3C6DD; --ink-3:#7F97B4; --blue:#4C8FF5; --blue-2:#6AA3F7; --blue-soft:#15335E;
  --navy:#040F1F; --navy-2:#0A1E38; --red-soft:#3A1A1F; --orange-soft:#3A2812; --green-soft:#0F3326; --grey-soft:#1A2D47;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#07172B; --surface:#0E2340; --surface-2:#112A4B; --line:#1E3A60; --line-2:#2A4A74;
  --ink:#EAF2FC; --ink-2:#B3C6DD; --ink-3:#7F97B4; --blue:#4C8FF5; --blue-2:#6AA3F7; --blue-soft:#15335E;
  --navy:#040F1F; --navy-2:#0A1E38; --red-soft:#3A1A1F; --orange-soft:#3A2812; --green-soft:#0F3326; --grey-soft:#1A2D47;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overscroll-behavior-x:none}
*,*::before,*::after{box-sizing:border-box}
body{overscroll-behavior-x:none;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.app{background:linear-gradient(90deg,var(--navy) 240px,transparent 240px)}
.side{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 20px;color:#fff;text-decoration:none;border-radius:12px}
.brand:hover{background:rgba(255,255,255,.05)}
.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--blue);display:grid;place-items:center;font-size:20px}
.brand b{display:block;font-family:var(--display);font-size:14.5px;letter-spacing:.02em;line-height:1.3;white-space:nowrap}
.brand-mark{overflow:hidden;flex:none}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand small{color:#9FB6D3;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#C4D4E8;text-decoration:none;font-size:14.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--blue);color:#fff}
.nav a .ic{width:20px;text-align:center}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.side-foot{font-size:12px;color:#7F97B4;padding:10px 12px;border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;padding:26px 32px 60px;max-width:1280px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--ink-3);font-size:14px}
.top .grow{flex:1}
.mnav{display:none}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:16px;font-weight:600}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card .hd h3{margin:0}
.card .hd .grow{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;min-height:38px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-2);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red)} .btn.danger:hover{border-color:var(--red)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn.lg{min-height:48px;padding:12px 20px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button.on{background:var(--blue)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px;font-size:15px}
.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-waiting{background:var(--red-soft);color:var(--red)}
.s-paid{background:var(--orange-soft);color:var(--orange)}
.s-preparing{background:var(--blue-soft);color:var(--blue)}
.s-shipped{background:var(--green-soft);color:var(--green)}
.s-delivered{background:var(--grey-soft);color:var(--ink-2)}
.s-cancelled{background:var(--grey-soft);color:var(--ink-3);text-decoration:line-through}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--grey-soft);color:var(--ink-2);white-space:nowrap}
.tag.blue{background:var(--blue-soft);color:var(--blue)} .tag.or{background:var(--orange-soft);color:var(--orange)} .tag.gr{background:var(--green-soft);color:var(--green)}

/* ---------- Tables ---------- */
.tw{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--surface-2)}
.t .r{text-align:right}
.t tr:last-child td{border-bottom:0}
.empty{padding:36px 10px;text-align:center;color:var(--ink-3)}

/* ---------- Dashboard ---------- */
.today{background:var(--navy);color:#fff;border-radius:22px;padding:32px;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;position:relative;overflow:hidden}
:root[data-theme="dark"] .today{background:var(--navy-2)}
.today::after{content:"";position:absolute;inset:auto -10% -60px -10%;height:120px;background:radial-gradient(60% 100% at 50% 100%,rgba(22,104,227,.45),transparent 70%);pointer-events:none}
.today h2{font-family:var(--display);font-size:30px;line-height:1.45;margin:10px 0 0;font-weight:700}
.today .date{color:#9FB6D3;font-size:14px}
.today .sumline{margin-top:22px;display:flex;flex-direction:column;gap:6px;color:#C4D4E8;font-size:14.5px;line-height:1.6}
.today .sumline b{color:#fff;margin-left:4px}
.tasks{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.task{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;color:#fff;text-decoration:none;cursor:pointer;text-align:left;width:100%}
.task:hover{background:rgba(255,255,255,.11)}
.task .n{font-family:var(--display);font-size:26px;font-weight:700;min-width:36px;text-align:right}
.task .dot{width:10px;height:10px;border-radius:50%}
.task .lbl{flex:1}
.task .lbl small{display:block;color:#9FB6D3;font-size:12.5px}
.task .go{color:#9FB6D3}
.task.zero{opacity:.5}
.kpi{padding:16px 18px}
.kpi .k{font-size:13px;color:var(--ink-3)}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;margin-top:2px}
.kpi .d{font-size:12.5px;margin-top:2px}
.kpi.profit{border-color:var(--blue);background:linear-gradient(0deg,var(--blue-soft),var(--surface) 70%)}
.up{color:var(--green)} .down{color:var(--red)}
.chart svg{display:block;width:100%;height:auto}
.statusbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--grey-soft);margin:6px 0 14px}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;font-size:13px}
.legend a{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2);text-decoration:none;padding:4px 0}
.legend a:hover{color:var(--blue)}
.legend b{color:var(--ink)}

/* ---------- Order form ---------- */
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 36px;gap:10px;align-items:start;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.item .pc{grid-column:1/4}
.item .x{grid-column:4;grid-row:1;align-self:end}
.item .meta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.item .x{border:0;background:transparent;cursor:pointer;color:var(--ink-3);font-size:20px;min-height:42px}
.item .x:hover{color:var(--red)}
.totals{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.totals .ln{display:flex;justify-content:space-between;gap:10px}
.totals .ln.big{font-size:20px;font-weight:700;padding-top:8px;border-top:1px dashed var(--line-2);margin-top:4px;font-family:var(--display)}
.profitbox{background:var(--blue-soft);border-radius:var(--r-md);padding:14px;margin-top:12px}
.profitbox .ln b{color:var(--blue)}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper button{flex:1;min-width:90px;border:1px solid var(--line-2);background:var(--surface);padding:10px 6px;border-radius:10px;cursor:pointer;font-size:13px}
.stepper button.done{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.stepper button.cur{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}

/* ---------- Misc blocks ---------- */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .top2{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar .track{height:10px;background:var(--grey-soft);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:99px}
.bignum{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1}
.msg{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;font-size:14.5px;line-height:1.6}
.yieldout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
.yieldout div{background:var(--surface);padding:14px}
.yieldout .k{font-size:12.5px;color:var(--ink-3)} .yieldout .v{font-family:var(--display);font-size:22px;font-weight:700}
.yieldout .hl{background:var(--blue-soft)}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-left:3px solid var(--blue);padding:10px 12px;border-radius:0 8px 8px 0}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;flex:none}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.prod{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.prod:hover{border-color:var(--blue)}
.prod .em{font-size:30px;width:52px;height:52px;border-radius:14px;background:var(--blue-soft);display:grid;place-items:center}
.prod .tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;text-align:center}
.prod .tiers div{background:var(--surface-2);border-radius:6px;padding:4px 2px}
.prod .tiers b{display:block;font-size:13.5px}
.prod.off{opacity:.55}

/* ---------- Modal / toast ---------- */
.ov{overscroll-behavior:contain;position:fixed;inset:0;background:rgba(4,15,31,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:560px;padding:22px;box-shadow:0 20px 60px rgba(4,15,31,.3)}
.modal h3{margin:0 0 14px;font-size:18px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
:root[data-theme="dark"] .toast{background:var(--blue)}

/* ---------- Customer-facing page ---------- */
.pub{max-width:460px;margin:0 auto;padding:18px 16px 40px}
.pub-head{background:var(--navy);color:#fff;border-radius:22px 22px 0 0;padding:22px 20px 26px;text-align:center}
.pub-head .brand-mark{margin:0 auto 10px;width:48px;height:48px;font-size:26px;border-radius:14px}
.pub-head b{font-family:var(--display);letter-spacing:.08em;font-size:18px;display:block}
.pub-head small{color:#9FB6D3}
.pub-body{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px;padding:20px}
.pub-body .it{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.pub-body .it:last-child{border-bottom:0}
.qrwrap{text-align:center;padding:18px;background:var(--surface-2);border-radius:16px;margin-top:16px}
.qrwrap .qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}
.qrwrap .qr img,.qrwrap .qr canvas{display:block;width:200px;height:200px}
.paid-state{text-align:center;padding:22px;background:var(--green-soft);color:var(--green);border-radius:16px;margin-top:16px;font-weight:600}
.backbar{display:flex;justify-content:space-between;align-items:center;max-width:460px;margin:0 auto;padding:10px 16px 0}

/* ---------- Responsive ---------- */
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .today{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .top h1{font-size:22px}
  .g2,.g3{grid-template-columns:1fr}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40}
  .mnav a,.mnav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--ink-3);text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer}
  .mnav .ic{font-size:20px}
  .mnav .on{color:var(--blue);font-weight:600}
  .mnav .fab{margin-top:-22px}
  .mnav .fab .ic{width:52px;height:52px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 6px 18px rgba(22,104,227,.4)}
  .item{grid-template-columns:1fr 1fr;}
  .item .pc{grid-column:1/-1}
  .item .x{position:absolute;right:6px;top:4px}
  .item{position:relative;padding-top:14px}
  .t.cards thead{display:none}
  .t.cards tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .t.cards td{border:0;padding:0}
  .t.cards td.hide-m{display:none}
  .app{background:none}
  .t.ord tr{grid-template-areas:"a t" "c s" "d s"}
  .t.ord td:nth-child(1){grid-area:a} .t.ord td:nth-child(2){grid-area:c} .t.ord td:nth-child(3){grid-area:d} .t.ord td:nth-child(4){grid-area:s;align-self:center;text-align:right} .t.ord td:nth-child(5){grid-area:t}
  .today{padding:24px 22px;border-radius:18px}
  .today h2{font-size:24px;line-height:1.5}
  .legend{grid-template-columns:repeat(2,1fr)}
  .yieldout{grid-template-columns:1fr 1fr}
  .modal{padding:18px}
  .ov{padding:20px 10px}
}
@media (max-width:860px){#dashrow,#ofgrid,#odgrid,#ygrid,#tgrid,#cgrid{grid-template-columns:1fr!important}#ofgrid>.card{position:static!important}}
.ck{width:18px;height:18px;accent-color:var(--blue);cursor:pointer;vertical-align:middle}
.t tr.sel td{background:var(--blue-soft)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:45;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:10px 12px 10px 18px;border-radius:16px;box-shadow:0 10px 30px rgba(4,15,31,.3);width:min(640px,calc(100% - 24px));font-size:14px}
.selbar .grow{flex:1}.selbar .btn.ghost{color:#fff}
:root[data-theme="dark"] .selbar{background:var(--navy-2);border:1px solid var(--line)}
@media (min-width:861px){.selbar{left:calc(50% + 120px)}}
@media (max-width:860px){.selbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .t.ord tr{grid-template-columns:auto 1fr auto;grid-template-areas:"k a t" "k c s" "k d s"}

@media (max-width:860px){.t.cards tr.sel td{background:transparent}.t.cards tr.sel{background:var(--blue-soft);border-radius:12px;padding:12px 8px}}

/* ---------- Label print ---------- */
.ptool{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
.ptool .grow{flex:1}
.pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 12px 60px;overflow-x:auto}
.pg{background:#fff;color:#000;box-shadow:0 2px 12px rgba(11,37,69,.15);flex:none}
.pg.a4{width:210mm;height:297mm;display:grid;grid-template-columns:105mm 105mm;grid-template-rows:148.5mm 148.5mm}
.pg.a4 .slabel{border:1px dashed #bbb;margin:0}
.pg.th{width:100mm;height:150mm}
.slabel{width:100%;height:100%;padding:5mm;display:flex;flex-direction:column;gap:2.5mm;font-family:var(--font);color:#000;overflow:hidden}
.pg.a4 .slabel{padding:6mm 7mm}
.l-k{font-size:7.5pt;color:#555}
.l-from{display:grid;grid-template-columns:auto 1fr;gap:3mm;align-items:center;font-size:8.5pt;line-height:1.35;border-bottom:.4mm solid #000;padding-bottom:2.5mm}
.l-from img{width:11mm;height:11mm;object-fit:cover;border-radius:2mm;display:block}
.l-to{flex:1;display:flex;flex-direction:column;gap:1.2mm;min-height:0}
.l-name{font-size:19pt;font-weight:700;line-height:1.3}
.l-phone{font-size:15pt;font-weight:700}
.l-addr{font-size:13pt;line-height:1.5}
.l-note{font-size:9.5pt;font-weight:600;border:.3mm solid #000;padding:1.5mm 2.5mm;border-radius:1.5mm}
.l-meta{display:flex;justify-content:space-between;align-items:flex-end;border-top:.4mm solid #000;padding-top:2mm;font-size:10.5pt}
.l-box{text-align:right}.l-box b{font-size:16pt}
.l-items{font-size:7.5pt;color:#333;line-height:1.35;max-height:10mm;overflow:hidden}
.l-warn{background:#000;color:#fff;text-align:center;font-weight:700;font-size:10pt;padding:2mm;border-radius:1.5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
  :root{padding:0!important}
  body.printing{background:#fff}
  body.printing .ptool,body.printing .toast{display:none!important}
  body.printing .pages{padding:0;gap:0;display:block}
  body.printing .pg{box-shadow:none;break-after:page;page-break-after:always}
  body.printing .pg:last-child{break-after:auto;page-break-after:auto}
  body.printing .pg.a4 .slabel{border-color:#ddd}
}

ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}

.grid>*,.stack>*{min-width:0}
.card .hd{flex-wrap:wrap}
.in,select.in,textarea.in{font-size:16px}
.main{margin:0 auto;max-width:1440px}

.sf-ic{display:none}

  .app{grid-template-columns:76px 1fr;background:linear-gradient(90deg,var(--navy) 76px,transparent 76px)}
  .side{padding:18px 10px}
  .brand{justify-content:center;padding:4px 0 18px}.brand>div:last-child{display:none}
  .nav a{justify-content:center;padding:12px 0;font-size:0;position:relative}
  .nav a .ic{font-size:20px;width:auto}

  .side-foot .dot-s{margin:0 auto}
  .main{padding:24px 24px 60px}

}

/* ---------- Order logic (สเปกข้อ 8, 11, 24) ----------
   เลือก Price Tier จากจำนวน: ≥20 → 20kg, ≥10 → 10kg, ≥5 → 5kg, อื่น ๆ → Retail
   ราคาและต้นทุนถูก "snapshot" ลง order_items ตอนสร้าง — แก้ Product ภายหลังไม่กระทบ Order เก่า */
function tierFor(p, q) {
  if (q >= 20) return {tier:'20kg', price:p.price_20kg};
  if (q >= 10) return {tier:'10kg', price:p.price_10kg};
  if (q >= 5)  return {tier:'5kg',  price:p.price_5kg};
  return {tier:'Retail', price:p.retail_price};
}
/* Order Number = แหล่งเดียวในระบบ: TK + YYMMDD (วันที่สร้าง) + เลขวิ่ง 4 หลัก
   ตัวนับเก็บใน counters และไม่ถอยหลัง — แก้ไข/ยกเลิกออเดอร์ไม่กระทบเลขเดิม */
function orderNumberFor(dateStr, counters, orders = []) {
  const d = parseD(dateStr);
  const pre = 'TK' + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate());
  const used = orders.filter(o => o.order_number.startsWith(pre)).reduce((m, o) => Math.max(m, +o.order_number.slice(pre.length)), 0);
  const n = Math.max(counters[pre] || 0, used) + 1; counters[pre] = n;
  return pre + pad(n, 4);
}
/* นิยามกำไร V1 (ใช้เหมือนกันทุกหน้า):
   Revenue = ค่าสินค้าหลังหักส่วนลด (ไม่รวมค่าส่ง)
   Profit  = Revenue − ต้นทุนสินค้า − ค่าแพ็กเกจ − ค่าใช้จ่ายอื่นของออเดอร์
   ไม่รวมค่าใช้จ่ายดำเนินงาน (โฆษณา ค่าไฟ ค่าแรง ค่าเช่า) · ค่าส่งถือว่าเก็บมาเท่ากับที่จ่ายขนส่ง */
function calcOrder(o) {
  o.items.forEach(it => {
    it.revenue = round2(it.selling_price * it.quantity);
    it.cost = round2(it.cost_per_unit * it.quantity);
    it.profit = round2(it.revenue - it.cost);
  });
  o.subtotal = round2(o.items.reduce((s, i) => s + i.revenue, 0));
  o.total = round2(o.subtotal + (+o.shipping_fee || 0) - (+o.discount || 0));
  o.total_cost = round2(o.items.reduce((s, i) => s + i.cost, 0));
  o.revenue = round2(o.subtotal - (+o.discount || 0));
  o.total_profit = round2(o.revenue - o.total_cost - (+o.packaging_cost || 0) - (+o.other_cost || 0));
  return o;
}

/* save(): เขียน private + public (orders, store, catalog) ใน multi-path update เดียว (atomic)
   G3: ถ้าเขียนล้มเหลว จะไม่จำว่าสำเร็จ — path ที่ล้มจะถูกส่งใหม่ในการบันทึกครั้งถัดไป (ไม่มี retry loop อัตโนมัติ) */
let RETRY_DEL = new Set(), PENDING_EXTRA = {};
function save(extra) {
  if (!READY) return Promise.resolve();
  stockSyncAll();                                                              // ออเดอร์เปลี่ยน → จอง/ตัด/คืนสต็อกอัตโนมัติ
  const f = toFlat(), up = {};
  Object.keys(f).forEach(k => { if (f[k] !== LASTFLAT[k]) up[k] = JSON.parse(f[k]); });
  Object.keys(LASTFLAT).forEach(k => { if (!(k in f)) up[k] = null; });
  RETRY_DEL.forEach(k => { if (!(k in f)) up[k] = null; }); RETRY_DEL = new Set();
  Object.assign(up, PENDING_EXTRA, extra || {}); PENDING_EXTRA = {};
  LASTFLAT = f;
  if (!Object.keys(up).length) return Promise.resolve();
  WRITING++;
  return Backend.update(up).then(() => { WRITING--; }, e => {
    WRITING--; console.error(e);
    Object.keys(up).forEach(k => { if (k.startsWith('public/catalog_images/')) PENDING_EXTRA[k] = up[k]; else if (up[k] === null) RETRY_DEL.add(k); else delete LASTFLAT[k]; });
    toast('บันทึกไม่สำเร็จ (' + (e.code || e.message) + ') · จะส่งใหม่ในการบันทึกครั้งถัดไป');
  });
}
function onRemote(val) {
  if (!USER) return;                                                            // ออกจากระบบแล้ว ไม่รับข้อมูลที่ค้างมา
  const {d, fixed} = fromRemote(val); const first = !READY;
  const prevFlat = LASTFLAT; DB = d; READY = true; LASTFLAT = toFlat();
  if (!val || !val.private || !val.private.meta) { LASTFLAT = {}; save(); }      // ครั้งแรก: สร้างค่าเริ่มต้น (ข้อมูลว่าง)
  else if (fixed) save();
  scheduleHeal();                                                               // G2: ตรวจ public/catalog ให้ตรงกับข้อมูลล่าสุด
  if (first) return render();
  if (JSON.stringify(LASTFLAT) === JSON.stringify(prevFlat)) return;           // เป็นข้อมูลที่เราเพิ่งเขียนเอง
  const busy = $('#ov') || /^#\/order\/(new|.+\/edit)/.test(location.hash) || location.hash.startsWith('#/settings');
  if (busy) { PENDING_REMOTE = true; toast('มีข้อมูลอัปเดตจากอุปกรณ์อื่น'); } else render();
}
/* เลขออเดอร์: จองเลขด้วย transaction ที่ /private/counters/{TKYYMMDD} — กันเลขซ้ำแม้เปิดหลายเครื่อง */
async function allocOrderNumber() {
  const d = new Date(); const pre = 'TK' + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate());
  const used = DB.orders.filter(o => o.order_number.startsWith(pre)).reduce((m, o) => Math.max(m, +o.order_number.slice(pre.length)), 0);
  const n = await Backend.tx('private/counters/' + pre, cur => Math.max(cur || 0, used) + 1);

}

/* ---------- Date ranges ---------- */
function range(key, cf, ct) {
  const t = new Date(); t.setHours(0, 0, 0, 0); let a = new Date(t), b = new Date(t);
  if (key === 'week') { const dw = (t.getDay() + 6) % 7; a.setDate(t.getDate() - dw); }
  else if (key === 'month') { a.setDate(1); }
  else if (key === 'lastmonth') { a = new Date(t.getFullYear(), t.getMonth() - 1, 1); b = new Date(t.getFullYear(), t.getMonth(), 0); }
  else if (key === 'custom') { return {from:cf || today(), to:ct || today()}; }
  return {from:ymd(a), to:ymd(b)};
}
const inRange = (o, r) => o.order_date >= r.from && o.order_date <= r.to;
function prevRange(r) {
  const a = parseD(r.from), b = parseD(r.to); const days = Math.round((b - a) / 86400000) + 1;
  const pb = new Date(a); pb.setDate(pb.getDate() - 1); const pa = new Date(pb); pa.setDate(pa.getDate() - days + 1);
  return {from:ymd(pa), to:ymd(pb)};
}
function summarize(r) {

/* ---------- PromptPay (EMVCo) ---------- */
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
function promptpay(id, amount) {
  const f = (t, v) => t + pad(v.length) + v; const clean = String(id).replace(/\D/g, '');
  const acc = clean.length >= 13 ? f('02', clean) : f('01', ('0000000000000' + '66' + clean.replace(/^0/, '')).slice(-13));
  let s = f('00', '01') + f('01', amount ? '12' : '11') + f('29', f('00', 'A000000677010111') + acc) + f('53', '764') + (amount ? f('54', Number(amount).toFixed(2)) : '') + f('58', 'TH') + '6304';
  return s + crc16(s);
}

  ];
  const pw = DB.orders.filter(orderNeedsWeigh).length; if (pw) tasks.push(['var(--orange)', pw, 'รอชั่งน้ำหนักจริง', 'ชั่งตอนแพ็กแล้วจึงส่งยอด/QR ให้ลูกค้า', 'orders?status=weigh']);
  const todo = tasks.reduce((a, t) => a + t[1], 0);

  const delta = (a, b) => { if (!b) return '<span class="muted">—</span>'; const p = (a - b) / b * 100; return `<span class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(0)}%</span> <span class="muted">เทียบช่วงก่อน</span>`; };

function topProducts(os, n) {
  const m = {}; os.forEach(o => o.items.forEach(i => { m[i.product_name] = m[i.product_name] || {q:0, rev:0}; m[i.product_name].q += i.quantity; m[i.product_name].rev += i.revenue; }));
  const arr = Object.entries(m).sort((a, b) => b[1].rev - a[1].rev).slice(0, n); const max = arr[0]?.[1].rev || 1;
  if (!arr.length) return '<div class="empty">ยังไม่มียอดขายในช่วงนี้</div>';
  return `<div class="bars">${arr.map(([k, v]) => `<div class="bar"><div class="top2"><span>${esc(k)}</span><span class="num muted">${n2(v.q)} kg · ${baht(v.rev)}</span></div><div class="track"><div class="fill" style="width:${v.rev / max * 100}%"></div></div></div>`).join('')}</div>`;
}
function salesChart() {
  let pts = [];
  if (CHART === 'm') {
    for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); const a = ymd(d), b = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)); const s = summarize({from:a, to:b}); pts.push({l:TH_M[d.getMonth()], v:s.sales, p:s.profit}); }
  } else {
    const n = +CHART; for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const s = summarize({from:ymd(d), to:ymd(d)}); pts.push({l: n === 7 ? TH_DAY[d.getDay()].slice(0, 2) : (i % 5 === 0 ? d.getDate() + '' : ''), v:s.sales, p:s.profit}); }
  }
  const W = 640, H = 230, pl = 44, pb = 26, pt = 10; const max = Math.max(...pts.map(p => p.v), 1) * 1.1;
  const bw = (W - pl) / pts.length; const y = v => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [0, .25, .5, .75, 1].map(f => max * f);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟยอดขาย">
    ${ticks.map(t => `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" /><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${t >= 1000 ? (t / 1000).toFixed(0) + 'k' : Math.round(t)}</text>`).join('')}
    ${pts.map((p, i) => { const x = pl + i * bw + bw * .18, w = bw * .64; return `<g><title>${p.l}: ${baht(p.v)} (กำไร ${baht(p.p)})</title><rect x="${x}" y="${y(p.v)}" width="${w}" height="${Math.max(0, H - pb - y(p.v))}" rx="${Math.min(5, w / 3)}" fill="var(--blue-soft)"/><rect x="${x}" y="${y(p.p)}" width="${w}" height="${Math.max(0, H - pb - y(p.p))}" rx="${Math.min(5, w / 3)}" fill="var(--blue)"/><text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${p.l}</text></g>`; }).join('')}
  </svg><div class="row small muted" style="margin-top:6px"><span><span style="color:var(--blue-soft);filter:brightness(.9)">■</span> ยอดขาย</span><span><span style="color:var(--blue)">■</span> กำไร</span></div>`;
}

const SEL = new Set();

        actual_kg:piece && !ids.length && i.weighed && i.actual_g ? i.actual_g / 1000 : '', actual_pcs:!piece && i.weighed ? (i.actual_pcs || '') : '',
        override:i.selling_price !== i.original_price, selling_price:i.selling_price, snap:{...i}}; })};

const availPieces = (pid, ownIds = []) => { const own = new Set(ownIds); return pieceStates(pid).filter(x => x.state === 'available' || own.has(x.id) || (x.state === 'reserved' && F && F.id && x.order_id === F.id)).sort((a, b) => b.g - a.g); };
const canPick = (p, m) => !!m && tracksPcs(p) && (m.type === 'PIECE_ACTUAL_WEIGHT' || m.type === 'WEIGHT');
function defaultPmode(p, m) { m = m || methodsOf(p)[0]; return m && m.type === 'PIECE_ACTUAL_WEIGHT' && availPieces(p.id).length ? 'pick' : 'count'; }
/* คำนวณบรรทัด: ราคา = น้ำหนักจริง(กรัม) × ราคา/kg · ยังไม่รู้น้ำหนักจริง = ประมาณการจากน้ำหนักเฉลี่ย (รอชั่งตอนแพ็ก) */
function lineCalc(l) {
  const p = P(l.product_id); if (!p) return null; const m = methodOf(p, l.method_id); if (!m) return null;
  const piece = tracksPcs(p); let g = 0, pcs = 0, weighed = true, pick = false;
  if (canPick(p, m) && (l.pmode || (m.type === 'PIECE_ACTUAL_WEIGHT' ? 'pick' : 'count')) === 'pick') { pick = true; const ix = pieceIndex(p.id); pcs = (l.piece_ids || []).length; g = (l.piece_ids || []).reduce((s, id) => s + (ix[id]?.g || 0), 0); }
  else if (m.type === 'PIECE_ACTUAL_WEIGHT') { pcs = Math.max(0, Math.round(+l.pcs || 0)); const ag = toG(l.actual_kg); if (ag > 0) g = ag; else { g = Math.round(pcs * countAvgG(p.id)); weighed = false; } }   // ระบุจำนวนตัว: รอชั่งจริง
  else { g = toG(l.kg); if (piece) { pcs = Math.max(0, Math.round(+l.actual_pcs || 0)); weighed = pcs > 0; } }
  const s = sizesOf(m).length ? (sizesOf(m).find(x => x.id === l.size_id) || sizesOf(m)[0]) : null;   // ตามไซซ์: ราคา + ราคาส่งของไซซ์นั้น
  const kg = g / 1000, keep = l.snap && l.snap.product_id === l.product_id && l.snap.method_id === m.id && (l.snap.size_id || '') === (s ? s.id : '');   // รายการเดิม: ราคา/ต้นทุน snapshot
  const t = keep ? {tier:l.snap.price_tier, price:l.snap.original_price} : tierForM(s || m, kg);
  const cost = keep ? l.snap.cost_per_unit : (+p.cost_per_unit || 0);
  const price = l.override && l.selling_price != null ? +l.selling_price : t.price;
  const rev = priceOfG(g, price), c = priceOfG(g, cost);
  return {p, m, s, grade:s ? s.grade : '', g, kg, pcs, weighed, pick, tier:t.tier, orig:t.price, price, cost, rev, c, profit:rev - c};
}

  const t = q.type || 'all', term = (q.q || '').toLowerCase();
  let cs = DB.customers.map(c => ({c, s:custStats(c.id)}));
  if (t !== 'all') cs = cs.filter(x => x.c.customer_type === t);
  if (term) cs = cs.filter(x => x.c.name.toLowerCase().includes(term) || (x.c.phone || '').includes(term));
  cs.sort((a, b) => b.s.spend - a.s.spend);
  const body = `<div class="card"><div class="row" style="margin-bottom:12px"><div class="seg">${['all', 'VIP', 'Regular', 'New'].map(k => `<button class="${t === k ? 'on' : ''}" onclick="go('#/customers?type=${k}')">${k === 'all' ? 'ทั้งหมด' : k}</button>`).join('')}</div><div class="grow"></div>
    <input class="in" style="max-width:240px;min-height:36px" placeholder="ค้นหาชื่อ / เบอร์" value="${esc(q.q || '')}" onchange="go('#/customers?type=${t}&q='+encodeURIComponent(this.value))"></div>
    <div class="tw"><table class="t cards"><thead><tr><th>ลูกค้า</th><th>ประเภท</th><th class="r">ออเดอร์</th><th class="r">ยอดซื้อรวม</th><th>ล่าสุด</th></tr></thead><tbody>
    ${cs.map(({c, s}) => `<tr class="click" onclick="go('#/customer/${c.id}')"><td><b>${esc(c.name)}</b><div class="small muted">${esc(c.phone)}</div></td><td><span class="tag ${c.customer_type === 'VIP' ? 'or' : c.customer_type === 'Regular' ? 'blue' : ''}">${c.customer_type}</span></td><td class="r num hide-m">${s.count}</td><td class="r num"><b>${baht(s.spend)}</b></td><td class="small muted num hide-m">${s.last ? fmtD(s.last) : '—'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  return shell('customers', 'Customers', 'ยอดซื้อและจำนวนออเดอร์คำนวณจากออเดอร์อัตโนมัติ', `<button class="btn pri" onclick="newCustomerModal()">＋ เพิ่มลูกค้า</button>`, body);
}
function newCustomerModal(fromOrder, id) {
  const c = id ? C(id) : {name:'', phone:'', line_contact:'', address:'', customer_type:'New', notes:''};
  const f = (k, l) => `<label class="f">${l}<input class="in" data-k="${k}" value="${esc(c[k])}"></label>`;
  modal(id ? 'แก้ไขลูกค้า' : 'เพิ่มลูกค้าใหม่', `<div class="fgrid">${f('name', 'ชื่อ')}${f('phone', 'เบอร์โทร')}${f('line_contact', 'LINE ID')}<label class="f">ประเภท<select class="in" data-k="customer_type">${['New', 'Regular', 'VIP'].map(x => `<option ${x === c.customer_type ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
    <label class="f" style="margin-top:12px">ที่อยู่จัดส่ง<textarea class="in" data-k="address" style="min-height:70px">${esc(c.address)}</textarea></label>${f('notes', 'หมายเหตุ')}`,
    `<button class="btn pri" onclick="saveCustomer(${!!fromOrder},'${id || ''}')">บันทึก</button>`);
}
function saveCustomer(fromOrder, id) {
  const v = {}; $$('#ov [data-k]').forEach(i => v[i.dataset.k] = i.value.trim());
  if (!v.name) return toast('ใส่ชื่อลูกค้าก่อน');
  const now = new Date().toISOString(); let cid = id;
  if (id) Object.assign(C(id), v, {updated_at:now});
  else { cid = nextId('C', DB.customers); DB.customers.push({id:cid, ...v, created_at:now, updated_at:now}); }
  save(); closeModal(); toast('บันทึกลูกค้าแล้ว');
  if (fromOrder && F) { F.customer_id = cid; }
  if (window.__pendingTrk) { const ids = window.__pendingTrk; window.__pendingTrk = null; return applyCustomer(ids, cid); }
  render();
}
function vCustomer(id) {
  const c = DB.customers.find(x => x.id === id); if (!c) return shell('customers', 'ไม่พบลูกค้า', '', '', '');
  const s = custStats(id); const avg = s.count ? s.spend / s.count : 0;
  const fav = {}; s.orders.forEach(o => o.items.forEach(i => fav[i.product_name] = (fav[i.product_name] || 0) + i.quantity));
  const favs = Object.entries(fav).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const body = `<div class="stack"><div class="grid g4">
    <div class="card kpi"><div class="k">ออเดอร์ทั้งหมด</div><div class="v num">${s.count}</div></div>
    <div class="card kpi"><div class="k">ยอดซื้อรวม (ที่ลูกค้าจ่าย)</div><div class="v num">${baht(s.spend)}</div></div>
    <div class="card kpi"><div class="k">เฉลี่ยต่อออเดอร์</div><div class="v num">${baht(avg)}</div></div>
    <div class="card kpi"><div class="k">สั่งล่าสุด</div><div class="v" style="font-size:20px">${s.last ? fmtD(s.last) : '—'}</div></div></div>
    <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start" id="cgrid">
      <div class="card"><h3>ประวัติการสั่งซื้อ</h3>${s.orders.length ? `<div class="tw"><table class="t cards"><tbody>${s.orders.map(o => `<tr class="click" onclick="go('#/order/${o.order_number}')"><td><b class="num">#${o.order_number}</b><div class="small muted">${o.items.map(i => esc(i.product_name.split(' ')[0])).join(', ')}</div></td><td class="small muted num">${fmtD(o.order_date)}</td><td>${pill(o.status)}</td><td class="r num"><b>${baht(o.total)}</b></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">ยังไม่เคยสั่งซื้อ</div>'}</div>
      <div class="stack"><div class="card"><div class="hd"><h3>ข้อมูลติดต่อ</h3><div class="grow"></div><button class="btn sm" onclick="newCustomerModal(false,'${c.id}')">แก้ไข</button></div>
        <dl class="kv small"><dt>ประเภท</dt><dd><span class="tag ${c.customer_type === 'VIP' ? 'or' : 'blue'}">${c.customer_type}</span></dd><dt>โทร</dt><dd>${esc(c.phone)}</dd><dt>LINE</dt><dd>${esc(c.line_contact)}</dd><dt>ที่อยู่</dt><dd>${esc(c.address)}</dd>${c.notes ? `<dt>หมายเหตุ</dt><dd style="color:var(--orange)">${esc(c.notes)}</dd>` : ''}</dl>
        <button class="btn pri" style="width:100%;margin-top:14px" onclick="F=newDraft();F.customer_id='${c.id}';go('#/order/new')">＋ สร้างออเดอร์ให้ลูกค้านี้</button>
        <button class="btn sm ghost danger" style="width:100%;margin-top:6px" onclick="deleteCustomer('${c.id}')">🗑 ลบลูกค้า</button></div>
        <div class="card"><h3>สินค้าที่สั่งบ่อย</h3>${favs.length ? favs.map(([k, v]) => `<div class="row small" style="justify-content:space-between;padding:4px 0"><span>${esc(k)}</span><b class="num">${n2(v)} kg</b></div>`).join('') : '<div class="muted small">—</div>'}</div></div>
    </div></div>`;
  return shell('customers', esc(c.name), 'ลูกค้าตั้งแต่ ' + fmtD(c.created_at.slice(0, 10)), `<a class="btn" href="#/customers">‹ Customers</a>`, body);
}

/* =========================================================
   TRACKING INBOX
   Tracking เป็น entity แยก: customer_id และ order_id เป็น optional
   ORDER 1 → TRACKING หลายเลข · ข้อความ 1 ข้อความต่อ (ลูกค้า + ออเดอร์)
   สถานะ: new → identifying → customer_matched → order_matched → message_ready → sent
   V1 ระบุผู้รับด้วยการเปิดหน้า Tracking ของขนส่งเอง (ไม่มี scraping / API)
   ========================================================= */
const TST = [
  {id:'new', label:'ใหม่', cls:'t-new'}, {id:'identifying', label:'กำลังตรวจสอบ', cls:'t-idf'},
  {id:'customer_matched', label:'จับคู่ลูกค้าแล้ว', cls:'t-cm'}, {id:'order_matched', label:'จับคู่ออเดอร์แล้ว', cls:'t-om'},
  {id:'message_ready', label:'ข้อความพร้อมส่ง', cls:'t-mr'}, {id:'sent', label:'ส่งแล้ว', cls:'t-sent'},
];
const tPill = id => { const s = TST.find(x => x.id === id) || TST[0]; return `<span class="pill ${s.cls}">${s.label}</span>`; };
const trkOf = o => DB.tracking.filter(t => t.order_id === o.id);
const T_ = id => DB.tracking.find(t => t.id === id);
const OID = id => DB.orders.find(o => o.id === id);
let TI = {filter:'open', paste:'', carrier:''};
const TSEL = new Set();
function touch(t, patch) { Object.assign(t, patch, {updated_at:new Date().toISOString()}); }

function parseTrackingNumbers(text) {
  return [...new Set(String(text).toUpperCase().split(/[\s,;]+/).map(s => s.replace(/[^A-Z0-9]/g, '')).filter(s => s.length >= 8))];
}
function addTrackings(nums, carrier, preset = {}) {
  const exist = new Set(DB.tracking.map(t => t.tracking_number)); const added = []; let dup = 0; const now = new Date().toISOString();
  nums.forEach(n => { if (exist.has(n)) { dup++; return; }
    const t = {id:uid('R'), tracking_number:n, carrier, customer_id:preset.customer_id || null, order_id:preset.order_id || null,
      status: preset.order_id ? 'order_matched' : preset.customer_id ? 'customer_matched' : 'new', message_id:null, created_at:now, updated_at:now, sent_at:null};
    DB.tracking.push(t); added.push(t); exist.add(n); });
  return {added, dup};
}

function vTracking(q) {
  if (q.filter) TI.filter = q.filter;
  const open = DB.tracking.filter(t => t.status !== 'sent');
  let rows = TI.filter === 'open' ? open : TI.filter === 'sent' ? DB.tracking.filter(t => t.status === 'sent') : DB.tracking.slice();
  const order = Object.fromEntries(TST.map((s, i) => [s.id, i]));
  rows.sort((a, b) => TI.filter === 'open' ? (order[a.status] - order[b.status]) || a.created_at.localeCompare(b.created_at) : b.updated_at.localeCompare(a.updated_at));
  const shown = rows.slice(0, 100); window.__tshown = shown.map(t => t.id);
  const allOn = shown.length && shown.every(t => TSEL.has(t.id));
  const carrier = TI.carrier || DB.settings.shipping.carrier;
  const nextBtn = t => !t.customer_id ? `<button class="btn sm pri" onclick="matchCustomerModal(['${t.id}'])">จับคู่ลูกค้า</button>`
    : t.status === 'message_ready' ? `<button class="btn sm pri" onclick="showMessage('${t.message_id}')">ดูข้อความ</button>`
    : t.status === 'sent' ? '' : `<button class="btn sm pri" onclick="genMessages(['${t.id}'])">✨ สร้างข้อความ</button>`;
  const body = `<div class="grid" style="grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start" id="tgrid">
    <div class="card"><h3>วางเลขพัสดุที่ได้จากขนส่ง</h3>
      <textarea class="in num" id="trn" placeholder="วางได้หลายเลขพร้อมกัน เช่น&#10;IE123456789TH&#10;IE123456790TH" oninput="TI.paste=this.value">${esc(TI.paste)}</textarea>
      <div class="row" style="margin-top:10px;flex-wrap:nowrap"><select class="in" style="max-width:200px" onchange="TI.carrier=this.value">${['Inter Express', 'Other'].map(c => `<option ${c === carrier ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <button class="btn pri" style="flex:1" onclick="pasteToInbox()">＋ เพิ่มเข้า Inbox</button></div>
    </div>
    <div class="card hide-s"><h3>ขั้นตอน</h3><ol class="steps small">
      <li>วางเลขพัสดุ ระบบแยกเป็นรายการให้เอง</li><li>กด <b>เปิด Tracking</b> ดูชื่อผู้รับบนหน้าขนส่ง</li><li><b>จับคู่ลูกค้า</b> ระบบจะแนะนำออเดอร์ที่น่าจะใช่</li><li>เลือกออเดอร์ หรือข้ามไปก่อนแล้วกลับมาทีหลังได้</li><li><b>สร้างข้อความ</b> หลายเลขของลูกค้าเดียวกันรวมเป็นข้อความเดียว</li></ol></div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="row" style="margin-bottom:12px"><div class="seg">${[['open', 'ยังไม่เสร็จ', open.length], ['sent', 'ส่งแล้ว', DB.tracking.length - open.length], ['all', 'ทั้งหมด', DB.tracking.length]].map(([k, l, n]) => `<button class="${TI.filter === k ? 'on' : ''}" onclick="TI.filter='${k}';TSEL.clear();render()">${l} <span class="num" style="opacity:.6">${n}</span></button>`).join('')}</div>
      <div class="grow"></div>${shown.length ? `<button class="btn sm" onclick="tSelAll(${!allOn})">${allOn ? 'ยกเลิกที่เลือก' : '☑ เลือกทั้งหมด'}</button>` : ''}</div>
    ${shown.length ? `<div class="tw"><table class="t cards trk"><thead><tr><th style="width:36px"></th><th>เลขพัสดุ</th><th>ลูกค้า</th><th>ออเดอร์</th><th>สถานะ</th><th class="r"></th></tr></thead><tbody>
    ${shown.map(t => { const c = t.customer_id ? C(t.customer_id) : null, o = t.order_id ? OID(t.order_id) : null;
      return `<tr class="${TSEL.has(t.id) ? 'sel' : ''}"><td><input type="checkbox" class="ck" aria-label="เลือก ${t.tracking_number}" ${TSEL.has(t.id) ? 'checked' : ''} onchange="tSel('${t.id}',this.checked)"></td>
      <td><b class="num">${esc(t.tracking_number)}</b><div class="small muted">${esc(t.carrier)}</div></td>
      <td>${c ? `<a href="#/customer/${c.id}">${esc(c.name)}</a>` : '<span class="muted">ยังไม่จับคู่</span>'} ${t.status !== 'sent' ? `<button class="btn sm ghost" onclick="matchCustomerModal(['${t.id}'])" aria-label="เปลี่ยนลูกค้า">✎</button>` : ''}</td>
      <td>${o ? `<a class="num" href="#/order/${o.order_number}">${o.order_number}</a>` : '<span class="muted">—</span>'} ${t.customer_id && t.status !== 'sent' ? `<button class="btn sm ghost" onclick="matchOrderModal(['${t.id}'])" aria-label="เลือกออเดอร์">✎</button>` : ''}</td>
      <td>${tPill(t.status)}</td>
      <td class="r"><div class="row" style="justify-content:flex-end;gap:6px;flex-wrap:nowrap"><a class="btn sm" target="_blank" rel="noopener" href="${esc(trackUrl(t.tracking_number))}" onclick="markIdentifying('${t.id}')">เปิด Tracking ↗</a>${nextBtn(t)}</div></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty">${TI.filter === 'open' ? 'ไม่มีเลขพัสดุค้างอยู่ 🎉<br><span class="small">วางเลขใหม่ในช่องด้านบนได้เลย</span>' : 'ยังไม่มีรายการ'}</div>`}
  </div>${tSelBar()}`;
  return shell('tracking', 'Tracking Inbox', 'วางเลขพัสดุ → เปิดดูผู้รับ → จับคู่ลูกค้า/ออเดอร์ → ส่งข้อความ', '', body);
}
function tSel(id, on) { on ? TSEL.add(id) : TSEL.delete(id); render(); }
function tSelAll(on) { (window.__tshown || []).forEach(id => on ? TSEL.add(id) : TSEL.delete(id)); render(); }
function tSelBar() {
  if (!TSEL.size) return '';
  const ids = JSON.stringify([...TSEL]).replace(/"/g, "'");
  return `<div class="selbar"><span><b class="num">${TSEL.size}</b> เลขพัสดุ</span><span class="grow"></span>
    <button class="btn sm" onclick="matchCustomerModal(${ids})">👤 จับคู่ลูกค้า</button>
    <button class="btn sm" onclick="matchOrderModal(${ids})">🧾 จับคู่ออเดอร์</button>
    <button class="btn sm pri" onclick="genMessages(${ids})">✨ สร้างข้อความ</button>
    <button class="btn sm ghost" onclick="deleteTrackings(${ids})" aria-label="ลบ">🗑</button>
    <button class="btn sm ghost" onclick="TSEL.clear();render()" aria-label="ล้างที่เลือก">✕</button></div>`;
}
function pasteToInbox() {
  const nums = parseTrackingNumbers(TI.paste);
  if (!nums.length) return toast('วางเลขพัสดุก่อน');
  const {added, dup} = addTrackings(nums, TI.carrier || DB.settings.shipping.carrier);
  TI.paste = ''; TI.filter = 'open'; TSEL.clear(); added.forEach(t => TSEL.add(t.id)); save(); render();
  toast(`เพิ่ม ${added.length} เลขพัสดุเข้า Inbox แล้ว${dup ? ` · ข้าม ${dup} เลขที่มีอยู่แล้ว` : ''}`);
}
function markIdentifying(id) { const t = T_(id); if (t && t.status === 'new') { touch(t, {status:'identifying'}); save(); setTimeout(render, 300); } }
function deleteTrackings(ids) {
  confirmModal(`ลบ ${ids.length} เลขพัสดุออกจาก Inbox? (ใช้เมื่อวางเลขผิด)`, 'ลบ', () => { DB.tracking = DB.tracking.filter(t => !ids.includes(t.id)); ids.forEach(i => TSEL.delete(i)); save(); render(); toast('ลบแล้ว'); }, true);
}

/* ----- Match customer ----- */
function matchCustomerModal(ids) {
  window.__mc = ids; const nums = ids.map(T_).filter(Boolean).map(t => t.tracking_number);
  modal('จับคู่ลูกค้า', `<p class="small muted" style="margin-top:0">${nums.length} เลข: ${esc(nums.slice(0, 4).join(', '))}${nums.length > 4 ? '…' : ''}</p>
    <input class="in" id="csq" placeholder="ค้นหาชื่อ เบอร์โทร LINE หรือที่อยู่" oninput="renderCustResults(this.value)">
    <div id="csr" class="stack" style="gap:6px;margin-top:10px;max-height:340px;overflow:auto"></div>
    <button class="btn sm" style="margin-top:10px" onclick="window.__pendingTrk=window.__mc;newCustomerModal()">＋ ลูกค้าใหม่</button>`);
  renderCustResults('');
}
function renderCustResults(qs) {
  const q = qs.trim().toLowerCase().replace(/-/g, ''); const el = $('#csr'); if (!el) return;
  let cs = DB.customers.map(c => ({c, s:custStats(c.id)}));
  if (q) cs = cs.filter(({c}) => [c.name, c.phone, c.line_contact, c.address].some(v => String(v || '').toLowerCase().replace(/-/g, '').includes(q)));
  // ลูกค้าที่มีออเดอร์รอส่งขึ้นก่อน
  const pend = c => DB.orders.some(o => o.customer_id === c.id && ['paid', 'preparing'].includes(o.status));
  cs.sort((a, b) => pend(b.c) - pend(a.c) || (b.s.last || '').localeCompare(a.s.last || ''));
  el.innerHTML = cs.slice(0, 12).map(({c}) => `<button class="pick" onclick="applyCustomer(window.__mc,'${c.id}')"><b>${esc(c.name)}</b>${pend(c) ? ' <span class="tag blue">มีออเดอร์รอส่ง</span>' : ''}<span class="small muted">${esc(c.phone || '')} · ${esc(c.line_contact || '')}</span><span class="small muted">${esc(c.address || '')}</span></button>`).join('') || '<div class="empty">ไม่พบลูกค้า</div>';
}
function applyCustomer(ids, cid) {
  ids.map(T_).filter(Boolean).forEach(t => { if (t.status === 'sent') return; const changed = t.customer_id !== cid;
    touch(t, {customer_id:cid, order_id: changed ? null : t.order_id, message_id:null, status: changed || !t.order_id ? 'customer_matched' : 'order_matched'}); });
  save(); render(); matchOrderModal(ids, true);
}

/* ----- Match order (optional) ----- */
function matchOrderModal(ids, afterCustomer) {
  const ts = ids.map(T_).filter(Boolean); const custs = [...new Set(ts.map(t => t.customer_id))];
  if (custs.includes(null)) return toast('จับคู่ลูกค้าก่อน แล้วค่อยเลือกออเดอร์');
  if (custs.length > 1) return toast('เลขที่เลือกเป็นของลูกค้าต่างกัน เลือกทีละลูกค้า');
  const c = C(custs[0]); window.__mo = ids;
  const prio = {preparing:0, paid:1, waiting:2, shipped:3, delivered:4};
  const cand = DB.orders.filter(o => o.customer_id === c.id && o.status !== 'cancelled').sort((a, b) => (prio[a.status] - prio[b.status]) || b.order_date.localeCompare(a.order_date)).slice(0, 6);
  const cur = ts[0].order_id;
  modal('เลือกออเดอร์ของ ' + c.name, `${afterCustomer ? `<div class="note" style="margin-bottom:12px">✓ จับคู่ลูกค้าแล้ว ${ts.length} เลข · เลือกออเดอร์ตอนนี้หรือทีหลังก็ได้</div>` : ''}
    ${cand.length ? `<div class="stack" style="gap:8px">${cand.map((o, i) => `<button class="pick ${o.id === cur ? 'on' : ''}" onclick="applyOrder(window.__mo,'${o.id}')">
      <span class="row" style="justify-content:space-between"><b class="num">${o.order_number}</b>${pill(o.status)}</span>

function applyOrder(ids, oid) {

/* ----- Messages: 1 ข้อความต่อ (ลูกค้า + ออเดอร์) ----- */
function msgVars(c, o, ts, carrier) {
  const urls = ts.map(t => trackUrl(t.tracking_number));
  return {customer_name:c.name.replace(/^คุณ\s*/, ''), order_number:o ? o.order_number : '', carrier, store_name:DB.settings.store.name,
    tracking_count:String(ts.length), tracking_numbers:ts.map((t, i) => `${ts.length > 1 ? (i + 1) + '. ' : '📦 '}${t.tracking_number}\n   ${urls[i]}`).join('\n'),
    tracking_url:urls.join('\n')};
}
function buildMessageText(m, tplId) {
  const tpl = DB.message_templates.find(t => t.id === tplId) || DB.message_templates[0];
  const ts = m.tracking_ids.map(T_).filter(Boolean);
  return fillTpl(tpl.template_text, msgVars(C(m.customer_id), m.order_id ? OID(m.order_id) : null, ts, ts[0]?.carrier || DB.settings.shipping.carrier));
}
function genMessages(ids) {
  const ts = ids.map(T_).filter(t => t && t.status !== 'sent');
  if (!ts.length) return toast('เลขที่เลือกส่งข้อความไปแล้ว');
  if (ts.some(t => !t.customer_id)) return toast('มีเลขที่ยังไม่จับคู่ลูกค้า จับคู่ก่อนนะคะ');
  const groups = {}; ts.forEach(t => { const k = t.customer_id + '|' + (t.order_id || ''); (groups[k] = groups[k] || []).push(t); });
  const tplId = window.__tpl || DB.message_templates[0].id; const created = [];
  Object.values(groups).forEach(g => {
    const m = {id:uid('M'), customer_id:g[0].customer_id, order_id:g[0].order_id || null, tracking_ids:g.map(t => t.id), template_id:tplId, text:'', created_at:new Date().toISOString(), sent_at:null};
    m.text = buildMessageText(m, tplId); DB.tracking_messages.push(m); created.push(m);
    g.forEach(t => touch(t, {status:'message_ready', message_id:m.id}));
  });
  save(); render(); showMessages(created.map(m => m.id));
}
function showMessage(id) { showMessages([id]); }
function showMessages(mids) {
  window.__mids = mids; const ms = mids.map(id => DB.tracking_messages.find(m => m.id === id)).filter(Boolean);
  modal(ms.length > 1 ? `สร้างแล้ว ${ms.length} ข้อความ` : 'ข้อความแจ้งลูกค้า', `
    <label class="f" style="margin-bottom:12px">รูปแบบข้อความ<select class="in" onchange="retemplate(this.value)">${DB.message_templates.filter(t => t.active).map(t => `<option value="${t.id}" ${ms[0]?.template_id === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>
    <div class="stack" style="gap:14px">${ms.map(m => { const c = C(m.customer_id), o = m.order_id ? OID(m.order_id) : null;
      return `<div><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>${esc(c.name)}</b><span class="small muted num">${o ? o.order_number : 'ยังไม่ระบุออเดอร์'} · ${m.tracking_ids.length} กล่อง</span></div>
      <textarea class="in" style="min-height:230px;font-size:14px" oninput="DB.tracking_messages.find(x=>x.id==='${m.id}').text=this.value;save()">${esc(m.text)}</textarea>
      <div class="row" style="margin-top:8px">${m.sent_at ? `<span class="tag gr">ส่งแล้ว ${fmtDT(m.sent_at)}</span><button class="btn sm" onclick="copyText(DB.tracking_messages.find(x=>x.id==='${m.id}').text)">📋 Copy อีกครั้ง</button>` : `<button class="btn sm pri" onclick="copySend('${m.id}')">📋 Copy และทำเครื่องหมายว่าส่งแล้ว</button><button class="btn sm" onclick="copyText(DB.tracking_messages.find(x=>x.id==='${m.id}').text)">Copy อย่างเดียว</button>`}</div></div>`; }).join('')}</div>`);
}
function retemplate(tplId) { window.__tpl = tplId; (window.__mids || []).forEach(id => { const m = DB.tracking_messages.find(x => x.id === id); if (m && !m.sent_at) { m.template_id = tplId; m.text = buildMessageText(m, tplId); } }); save(); showMessages(window.__mids); }
function copySend(mid) {
  const m = DB.tracking_messages.find(x => x.id === mid); copyText(m.text); const now = new Date().toISOString(); m.sent_at = now;
  m.tracking_ids.map(T_).filter(Boolean).forEach(t => { touch(t, {status:'sent', sent_at:now}); TSEL.delete(t.id); });
  const o = m.order_id ? OID(m.order_id) : null; if (o && ['paid', 'preparing'].includes(o.status)) { o.status = 'shipped'; o.payment_status = 'paid'; }
  save(); showMessages(window.__mids); render();
}

let RP = 'sales';

  const rev = s.os.reduce((a, o) => a + o.revenue, 0);

    <div class="note" style="margin-top:14px">กำไร V1 = รายได้หลังส่วนลด − ต้นทุนสินค้า − แพ็กเกจ − ค่าใช้จ่ายอื่นของออเดอร์ · ยังไม่รวมค่าโฆษณา ค่าไฟ ค่าแรง ค่าเช่า · ค่าส่งที่เก็บจากลูกค้า (${baht(ship)}) ถือว่าจ่ายให้ขนส่งเท่ากัน</div></div>`;

    csv = [['สินค้า', 'จำนวน kg', 'รายได้', 'ต้นทุน', 'กำไร'], ...prows.map(([k, v]) => [k, v.q, v.rev, v.cost, v.profit])];
  }

/* =========================================================
   STOCK / INVENTORY V1
   หลักการ: ONE PHYSICAL STOCK → ALLOCATE → RESERVE → SELL
   - หน่วยฐาน: น้ำหนักเก็บเป็น "กรัม" (จำนวนเต็ม) · สินค้านับตัวใช้ "ตัว" เป็นหน่วยหลักของการขาย/จอง/จัดสรร
   - Physical = ผลรวมของ stock_movements (RECEIVE, SALE, RETURN, ADJUSTMENT, SPOILAGE, GIVEAWAY) — ไม่มีการแก้ตัวเลขตรง ๆ
   - RESERVE / RELEASE_RESERVATION บันทึกเป็นประวัติ แต่ไม่เปลี่ยน Physical
   - ตัดขายแบบ FIFO (Lot ที่รับเข้าก่อน ถูกตัดก่อน) · คืนของเข้า Lot เดิมที่ถูกตัด (ล่าสุดก่อน)
   - กฎออเดอร์ ↔ สต็อก:
       รอชำระ / ชำระแล้ว / กำลังเตรียม  → จอง (Reserved)
       จัดส่งแล้ว / ได้รับสินค้า          → ขาย (Sold) ตัดจาก Lot แบบ FIFO
       ยกเลิก / ลบ                       → ปล่อยการจอง หรือคืนของเข้า Lot ถ้าตัดไปแล้ว
   - ช่องทาง: Allocated(ช่องทาง) + Unallocated = Physical · ช่องทางขายได้ = (จัดสรรของตัวเอง − จองของตัวเอง) + Unallocated ที่ว่าง
     ขายแล้วหักจากโควตาช่องทางนั้นก่อน · ของคืนกลับเข้า Unallocated
   ========================================================= */
const CHANNELS = ['LINE', 'Website', 'Lazada', 'Other'];
const STYPE = {WEIGHT_ONLY:'⚖️ น้ำหนักอย่างเดียว', PIECE_BY_WEIGHT:'🐟 นับตัว + น้ำหนัก'};
const MVT = {RECEIVE:'รับเข้า', SALE:'ขาย', RESERVE:'จอง', RELEASE_RESERVATION:'ยกเลิกจอง', ADJUSTMENT:'ปรับยอด', SPOILAGE:'เสีย / คัดทิ้ง', GIVEAWAY:'แถมลูกค้า', RETURN:'คืนเข้าสต็อก'};
const PHYS = new Set(['RECEIVE', 'SALE', 'RETURN', 'ADJUSTMENT', 'SPOILAGE', 'GIVEAWAY']);
const ADJ_REASONS = [['WEIGHT_DIFF', 'น้ำหนักจริงไม่ตรง', 'ADJUSTMENT'], ['SPOILAGE', 'เสีย / คัดทิ้ง', 'SPOILAGE'], ['GIVEAWAY', 'แถมลูกค้า', 'GIVEAWAY'], ['PREP_LOSS', 'น้ำหนักลดจากการเตรียมสินค้า', 'ADJUSTMENT'], ['OTHER', 'อื่น ๆ', 'ADJUSTMENT']];
const isPiece = p => false;   // หน่วยฐานของสต็อกเป็นกรัมเสมอ (จำนวนตัวเก็บคู่ใน movements สำหรับสินค้านับตัว)
const stockOn = p => !!p && !!p.stock_enabled;
const fmtW = g => { g = Math.round(g || 0); const a = Math.abs(g); return (g < 0 ? '−' : '') + (a < 1000 ? a.toLocaleString('th-TH') + ' g' : (a / 1000).toLocaleString('th-TH', {maximumFractionDigits:3}) + ' kg'); };
const fmtQ = (p, q) => isPiece(p) ? `${(q || 0).toLocaleString('th-TH')} ตัว` : fmtW(q);
const toG = kg => Math.round((parseFloat(kg) || 0) * 1000);
const itemQty = (p, i) => isPiece(p) ? Math.round(+i.quantity || 0) : Math.round((+i.quantity || 0) * 1000);   // ออเดอร์ (kg / ตัว) → หน่วยฐาน
const fifo = (a, b) => (a.received_at + a.created_at).localeCompare(b.received_at + b.created_at);
const allocRec = pid => { let r = DB.stock_allocations.find(a => a.id === pid); if (!r) { r = {id:pid, product_id:pid}; CHANNELS.forEach(c => r[c] = 0); DB.stock_allocations.push(r); } return r; };

function mv(o) {
  const m = {id:uid('S'), at:new Date().toISOString(), product_id:o.product_id, lot_id:o.lot_id || null, type:o.type, grams:Math.round(o.grams || 0), pcs:Math.round(o.pcs || 0), reason:o.reason || '', order_id:o.order_id || null, by:USER?.email || ''};
  if (o.piece_id) m.piece_id = o.piece_id;
  if (o.bucket && o.bucket !== '*') m.bucket = o.bucket;          // ไซซ์ที่ขาย (ตัดเฉพาะ Lot ไซซ์นั้น) · ไม่มี = Lot ไหนก็ได้
  DB.stock_movements.push(m); return m;
}
function stockOf(pid) {
  const p = P(pid); const lots = DB.stock_lots.filter(l => l.product_id === pid).sort(fifo);
  const rem = {}; lots.forEach(l => rem[l.id] = {g:0, pc:0}); const byType = {}; let g = 0, pc = 0;
  DB.stock_movements.forEach(m => { if (m.product_id !== pid) return;
    if (PHYS.has(m.type)) { g += m.grams; pc += m.pcs; if (rem[m.lot_id]) { rem[m.lot_id].g += m.grams; rem[m.lot_id].pc += m.pcs; } const t = byType[m.type] = byType[m.type] || {g:0, pc:0}; t.g += m.grams; t.pc += m.pcs; } });
  const base = isPiece(p) ? pc : g;
  const R = {}, A = {}; const al = DB.stock_allocations.find(a => a.id === pid) || {};
  CHANNELS.forEach(c => { R[c] = 0; A[c] = al[c] || 0; });
  DB.stock_reservations.forEach(r => { if (r.product_id === pid && r.status === 'active') R[r.channel || 'LINE'] = (R[r.channel || 'LINE'] || 0) + r.qty; });
  const sumA = CHANNELS.reduce((s, c) => s + A[c], 0), sumR = CHANNELS.reduce((s, c) => s + R[c], 0), U = base - sumA;
  const over = CHANNELS.reduce((s, c) => s + Math.max(0, R[c] - A[c]), 0), Ufree = U - over;
  const sell = {}; CHANNELS.forEach(c => sell[c] = Math.max(0, A[c] - R[c]) + Math.max(0, Ufree));
  const value = lots.reduce((s, l) => s + Math.max(0, rem[l.id].g) / 1000 * (l.cost_per_kg || 0), 0);
  return {p, lots, rem, g, pc, base, A, R, sumA, sumR, U, Ufree, avail:base - sumR, sell, byType, value};
}
function clampAlloc(pid) {   // จัดสรรรวมต้องไม่เกิน Physical — ลดจาก Other → Lazada → Website → LINE
  const st = stockOf(pid); let over = st.sumA - Math.max(0, st.base); if (over <= 0) return; const r = allocRec(pid);
  ['Other', 'Lazada', 'Website', 'LINE'].forEach(c => { const cut = Math.min(over, r[c] || 0); r[c] = (r[c] || 0) - cut; over -= cut; });
}
function reduceAlloc(pid, ch, q) { const r = DB.stock_allocations.find(a => a.id === pid); if (r && r[ch] > 0) r[ch] = Math.max(0, r[ch] - q); }

/* ----- Order ↔ Stock (เรียกอัตโนมัติจาก save() เมื่อออเดอร์เปลี่ยน) ----- */
function orderStockSig(o, deleted) {   // รายการรุ่นเก่าให้ลายเซ็นเท่าเดิม (ไม่ซิงก์ย้อนหลัง) · field ใหม่ต่อท้ายเมื่อมีเท่านั้น
  const sig = i => { const a = [i.product_id, +i.quantity, i.weight_g || 0]; if ((i.piece_ids || []).length) a.push([...i.piece_ids].sort()); if ('weighed' in i) a.push([!!i.weighed, i.actual_g || 0, i.actual_pcs || 0, i.req_pcs || 0]); if (i.grade) a.push('g:' + i.grade); return a; };
  return JSON.stringify([deleted ? 'X' : o.status, o.channel || 'LINE', (o.items || []).map(sig)]);
}
function desiredFor(o, deleted) {
  const mode = deleted || o.status === 'cancelled' ? 'none' : ['shipped', 'delivered'].includes(o.status) ? 'sold' : 'reserve';
  const need = {}; (o.items || []).forEach(i => { const p = P(i.product_id); if (!stockOn(p)) return;
    const n = need[p.id] = need[p.id] || {q:0, g:0, gKnown:true}; const q = itemQty(p, i); n.q += q;
    if (isPiece(p)) { if (i.weight_g > 0) n.g += Math.round(i.weight_g); else n.gKnown = false; } else n.g += q; });
  return {mode, need};
}
function orderLotNet(oid, pid) { const net = {}; DB.stock_movements.forEach(m => { if (m.order_id === oid && m.product_id === pid && (m.type === 'SALE' || m.type === 'RETURN')) { const n = net[m.lot_id] = net[m.lot_id] || {g:0, pc:0}; n.g -= m.grams; n.pc -= m.pcs; } }); return net; }
function syncOrderStock(o, deleted) {
  const {mode, need} = desiredFor(o, deleted); const ch = o.channel || 'LINE', now = new Date().toISOString(), warn = [];
  const why = mode === 'none' ? `ยกเลิก/ลบ ${o.order_number}` : `ออเดอร์ ${o.order_number}`;
  const pids = new Set(Object.keys(need));
  DB.stock_reservations.forEach(r => { if (r.order_id === o.id && r.status === 'active') pids.add(r.product_id); });
  DB.stock_movements.forEach(m => { if (m.order_id === o.id && (m.type === 'SALE' || m.type === 'RETURN')) pids.add(m.product_id); });
  pids.forEach(pid => {
    const p = P(pid); if (!p) return;
    if (isPBW(p)) { syncPBW(o, p, mode, ch, why, warn); clampAlloc(pid); return; }
    // สินค้าน้ำหนัก: แยกตาม "ไซซ์" ที่ขาย (bucket) · ตามไซซ์ = เฉพาะ Lot ไซซ์นั้น · ตามน้ำหนัก ('*') = Lot ไหนก็ได้ (เก่าสุดก่อน)
    const its = (o.items || []).filter(i => i.product_id === pid), wantB = {};
    if (mode !== 'none') its.forEach(i => { const b = i.grade || '*'; wantB[b] = (wantB[b] || 0) + Math.round((+i.quantity || 0) * 1000); });
    const rB = mode === 'reserve' ? wantB : {}, rQ = Object.values(rB).reduce((s, v) => s + v, 0);
    const byG = o2 => Object.fromEntries(Object.keys(o2).sort().filter(k => o2[k]).map(k => [k, {g:o2[k]}]));
    const act = DB.stock_reservations.filter(r => r.order_id === o.id && r.product_id === pid && r.status === 'active');
    const curKey = act.length === 1 ? JSON.stringify([act[0].qty, act[0].by_grade || {}, act[0].channel]) : act.length ? 'multi' : JSON.stringify([0, {}, ch]);
    if (curKey !== JSON.stringify([rQ, byG(rB), rQ ? ch : ch])) {
      act.forEach(r => { r.status = mode === 'sold' ? 'committed' : 'released'; r.updated_at = now;
        if (mode !== 'sold') mv({type:'RELEASE_RESERVATION', product_id:pid, grams:r.qty, pcs:0, order_id:o.id, reason:why}); });
      if (rQ) { DB.stock_reservations.push({id:uid('V'), product_id:pid, order_id:o.id, channel:ch, qty:rQ, by_grade:byG(rB), status:'active', created_at:now, updated_at:now});
        mv({type:'RESERVE', product_id:pid, grams:rQ, pcs:0, order_id:o.id, reason:`${why} (${ch})${Object.keys(rB).filter(b => b !== '*').map(b => ' · ' + b).join('')}`}); }
    }
    const curB = {}, netLB = {};
    DB.stock_movements.forEach(m => { if (m.order_id === o.id && m.product_id === pid && !m.piece_id && (m.type === 'SALE' || m.type === 'RETURN')) { const b = m.bucket || '*'; curB[b] = (curB[b] || 0) - m.grams; netLB[b + '|' + m.lot_id] = (netLB[b + '|' + m.lot_id] || 0) - m.grams; } });
    const soldW = mode === 'sold' ? wantB : {}, st = stockOf(pid), rem = Object.fromEntries(st.lots.map(l => [l.id, st.rem[l.id].g]));
    [...new Set([...Object.keys(soldW), ...Object.keys(curB)])].forEach(b => {
      let dq = (soldW[b] || 0) - (curB[b] || 0);
      const lots = st.lots.filter(l => b === '*' || (l.grade || '').trim() === b);
      if (dq > 0) { for (const l of lots) { if (dq <= 0) break; const take = Math.min(rem[l.id], dq); if (take <= 0) continue;
          mv({type:'SALE', product_id:pid, lot_id:l.id, grams:-take, pcs:0, order_id:o.id, bucket:b, reason:`${why} (${ch})${b !== '*' ? ' · ' + b : ''}`}); reduceAlloc(pid, ch, take); rem[l.id] -= take; dq -= take; }
        if (dq > 0) warn.push(`${p.name}${b !== '*' ? ' ' + b : ''}: สต็อกไม่พอ ตัดไม่ได้อีก ${fmtW(dq)}`); }
      else if (dq < 0) { let back = -dq; for (const l of lots.slice().reverse()) { if (back <= 0) break; const sold = netLB[b + '|' + l.id] || 0; if (sold <= 0) continue; const give = Math.min(sold, back);
          mv({type:'RETURN', product_id:pid, lot_id:l.id, grams:give, pcs:0, order_id:o.id, bucket:b, reason:why}); rem[l.id] += give; back -= give; } }
    });
    clampAlloc(pid);
  });
  if (warn.length) setTimeout(() => toast(warn.join(' · ')), 50);
}
function stockSyncAll() {
  DB.orders.forEach(o => { const s = orderStockSig(o, false); if (o.stock_sig !== s) { syncOrderStock(o, false); o.stock_sig = s; } });
  DB.trash_orders.forEach(o => { const s = orderStockSig(o, true); if (o.stock_sig !== s) { syncOrderStock(o, true); o.stock_sig = s; } });
}

const CAT_DEFAULTS = {WEIGHT_ONLY:{low:3000, min:1000}, SIZE_GRADE_WEIGHT:{low:3000, min:1000}, PIECE_AND_WEIGHT:{low:3, min:1}};

function lastReceived(pid) { let d = null; DB.stock_lots.forEach(l => { if (l.product_id === pid && (!d || l.received_at > d)) d = l.received_at; }); return d; }
/* allowlist: สร้าง object ใหม่ทีละ field — ไม่มีการคัดลอก product ทั้งก้อน · ราคาเปิดเฉพาะ retail_price */
function catalogProduct(p, i) {

/* ----- G2 self-healing: เทียบ catalog ที่คำนวณได้กับบน server แล้วเขียนเฉพาะที่ต่าง ----- */
const canon = v => { if (v === null || v === undefined) return undefined; if (Array.isArray(v)) { const a = v.map(canon).filter(x => x !== undefined); return a.length ? a : undefined; }
  if (typeof v === 'object') { const o = {}; Object.keys(v).sort().forEach(k => { const c = canon(v[k]); if (c !== undefined) o[k] = c; }); return Object.keys(o).length ? o : undefined; }
  if (v === '') return undefined; return v; };
const cs = v => JSON.stringify(canon(v) ?? null);
let SERVER_CAT = undefined, HEAL_T = null, HEAL_LOG = [], WRITING = 0;
function scheduleHeal() { clearTimeout(HEAL_T); HEAL_T = setTimeout(healCatalog, 2000); }
function healCatalog() {
  if (!READY || !DB || SERVER_CAT === undefined) return;
  if (WRITING > 0) return scheduleHeal();                                       // รอให้การเขียนของเราเองเสร็จก่อน
  const now = Date.now(); HEAL_LOG = HEAL_LOG.filter(t => now - t < 60000);
  if (HEAL_LOG.length >= 5) { console.warn('catalog heal rate-limited'); return; }   // กัน loop: ไม่เกิน 5 ครั้ง/นาที
  const want = buildCatalog(), srv = {}, sc = SERVER_CAT || {};
  if (sc.meta) srv['public/catalog/meta'] = sc.meta;
  Object.entries(sc.products || {}).forEach(([k, v]) => srv['public/catalog/products/' + k] = v);
  const up = {};
  Object.keys(want).forEach(k => { if (cs(want[k]) !== cs(srv[k])) up[k] = want[k]; });
  Object.keys(srv).forEach(k => { if (!(k in want)) up[k] = null; });
  if (!Object.keys(up).length) return;                                          // เหมือนกันแล้ว → ไม่เขียน
  HEAL_LOG.push(now); WRITING++;
  Backend.update(JSON.parse(JSON.stringify(up))).then(() => WRITING--, e => { WRITING--; console.error('heal', e); });
}

/* ----- รูปสินค้า: ย่อในเบราว์เซอร์ เป็น WebP (fallback JPEG ถ้าเบราว์เซอร์ไม่รองรับ) ----- */
function shrink(img, max, q) {
  const r = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * r), h = Math.round(img.height * r);

    PIMG = {thumb:shrink(img, 320, 0.72), large}; $('#pimg').innerHTML = `<img src="${PIMG.thumb.data}" alt="">`;

/* =========================================================

/* ย้ายข้อมูลรุ่นเก่า → โมเดลใหม่ (ทำครั้งเดียว อัตโนมัติ) */

/* ----- ปลารายตัว / ของรวม (สินค้านับตัว) ----- */
const pieceIndex = pid => { const ix = {}; DB.stock_lots.forEach(l => { if (l.product_id === pid && l.mode === 'pieces') (l.pieces || []).forEach(pc => ix[pc.id] = {...pc, lot_id:l.id, lot_code:l.lot_code}); }); return ix; };
function pieceStates(pid) {
  const ix = pieceIndex(pid), sold = {}, res = {};
  DB.stock_movements.forEach(m => { if (m.product_id === pid && m.piece_id && (m.type === 'SALE' || m.type === 'RETURN')) sold[m.piece_id] = (sold[m.piece_id] || 0) + (m.type === 'SALE' ? 1 : -1); });

  return Object.values(ix).map(pc => ({...pc, state:pc.out || (sold[pc.id] > 0 ? 'sold' : res[pc.id] ? 'reserved' : 'available'), order_id:res[pc.id] || null}));

/* ของรวมต่อ Lot = คงเหลือของ Lot − ปลารายตัวที่ยังเป็นตัว (ว่าง/จอง) · ใช้ขายแบบไม่ระบุตัว */

  st.lots.forEach(l => { const t = intact[l.id] || {g:0, pc:0}; out[l.id] = {g:Math.max(0, st.rem[l.id].g - t.g), pc:Math.max(0, st.rem[l.id].pc - t.pc)}; });

function countSellable(pid, exceptOrder, grade) {   // grade: เฉพาะ Lot ไซซ์นั้น (ไม่ส่ง = ทุก Lot)

  const f = lots.reduce((s, l) => ({g:s.g + (fl[l.id] || {g:0}).g, pc:s.pc + (fl[l.id] || {pc:0}).pc}), {g:0, pc:0});

    if (grade) { const x = (r.by_grade || {})[grade]; if (x) { f.g -= x.g || 0; f.pc -= x.pc || 0; } } else { f.g -= (r.count_g || 0); f.pc -= (r.count_pcs || 0); } });

/* สินค้าน้ำหนัก: ขายได้ของไซซ์นี้ = คงเหลือของ Lot ไซซ์นี้ − ที่ออเดอร์อื่นจองไซซ์นี้ไว้ (ไม่เกินยอดขายได้ทั้งหมด) */

  DB.stock_reservations.forEach(r => { if (r.product_id === pid && r.status === 'active' && r.order_id !== exceptOrder) g -= (((r.by_grade || {})[grade]) || {}).g || 0; });

/* ----- Stock sync สำหรับสินค้านับตัว (ปลารายตัว + ของรวม) ----- */
function itemCount(i) { const w = !!i.weighed || !i.needs_weigh; return {g:w ? Math.round(+i.actual_g || (+i.quantity || 0) * 1000) : Math.round((+i.quantity || 0) * 1000), pc:w ? (+i.actual_pcs || 0) : (+i.req_pcs || 0), weighed:w, b:i.grade || '*'}; }
function syncPBW(o, p, mode, ch, why, warn) {

  // ขายแบบไม่ระบุตัว (ชั่งแล้ว): ตัดน้ำหนักจริง + จำนวนตัวจริง แบบ FIFO จากของรวม · แยกตามไซซ์ที่ขาย (ตามไซซ์ = เฉพาะ Lot ไซซ์นั้น)

  });
}

/* ----- ชั่งน้ำหนักจริงตอนแพ็ก ----- */
